↓AdminStyles [ngx.components.UIStyle-1788364318568]: 
  styleContent: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
      - com.twinsoft.convertigo.beans.common.FormatedContent: 
        →: |
          '
          :host {
            color-scheme: light dark;
            --admin-bg: #f5f7fb;
            --admin-surface: #ffffff;
            --admin-ink: #172033;
            --admin-muted: #657189;
            --admin-line: #d9e0ea;
            --admin-accent: #079bbb;
            --admin-shadow: rgba(23,32,51,.07);
            --ion-background-color: var(--admin-bg);
            --ion-text-color: var(--admin-ink);
          }
          ion-header, ion-toolbar {
            --background: var(--admin-surface);
            --color: var(--admin-ink);
            color: var(--admin-ink);
          }
          ion-header { border-bottom: 1px solid var(--admin-line); }
          ion-content {
            --background: var(--admin-bg);
            --color: var(--admin-ink);
            color: var(--admin-ink);
          }
          .admin-shell { width: min(1080px, 100%); margin: 0 auto; padding: 24px 18px 48px; }
          .admin-hero { margin-bottom: 20px; }
          .admin-eyebrow { color: var(--admin-accent); font-size: 12px; font-weight: 700; text-transform: uppercase; }
          .admin-title { margin: 6px 0; color: var(--admin-ink); font-size: 30px; font-weight: 750; }
          .admin-copy, .admin-meta { color: var(--admin-muted); line-height: 1.5; }
          .admin-card, .admin-token-card {
            --background: var(--admin-surface);
            color: var(--admin-ink);
            border: 1px solid var(--admin-line);
            border-radius: 8px;
          }
          .admin-card { margin: 0 0 16px; box-shadow: 0 8px 24px var(--admin-shadow); }
          .admin-card ion-card-title,
          .admin-card ion-card-subtitle,
          .admin-token-card ion-card-title,
          .admin-token-card ion-card-subtitle,
          .admin-token-card h3 { color: var(--admin-ink); }
          .admin-card ion-card-subtitle { color: var(--admin-muted); }
          .admin-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
          .admin-form-grid { display: grid; grid-template-columns: minmax(240px,1fr) minmax(160px,220px); gap: 12px; margin-bottom: 14px; }
          .admin-form-grid ion-input,
          .admin-secret ion-textarea {
            --background: var(--admin-surface);
            --color: var(--admin-ink);
            --placeholder-color: var(--admin-muted);
            --border-color: var(--admin-line);
          }
          .admin-secret { border-left: 4px solid var(--admin-accent); }
          .admin-secret ion-textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
          .admin-token-card { box-shadow: none; }
          .admin-token-status { color: var(--admin-accent); font-weight: 700; text-transform: uppercase; }
          .admin-error { color: #e05252; font-weight: 650; }
          .admin-empty { padding: 18px 4px; color: var(--admin-muted); }
          @media (prefers-color-scheme: dark) {
            :host {
              --admin-bg: #050b18;
              --admin-surface: #0e1728;
              --admin-ink: #edf3fb;
              --admin-muted: #9aa8bc;
              --admin-line: #2a394f;
              --admin-accent: #19c2df;
              --admin-shadow: rgba(0,0,0,.3);
            }
          }
          @media (max-width: 680px) {
            .admin-form-grid { grid-template-columns: 1fr; }
            .admin-title { font-size: 24px; }
          }
          '
