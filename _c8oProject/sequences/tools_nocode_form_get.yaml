accessibility: Private
comment: |
  Read an existing No Code form without modifying it
  Use before auditing, proposing improvements, or editing a form identified by its document id. Reads the latest saved form through C8Oforms.APIV2_getDocument with the authenticated No Code bearer user and existing ACLs. Returns status, fetched and form on success; auth_required for token failures or unavailable when the form is missing or inaccessible. Never use an empty edit/update to read. The token is supplied out-of-band by the integrated host.
↓Run [steps.SimpleStep-1789129239378]: 
  expression: |
    'include("js/nocode_forms.js");
    try {
      var current = C8O.nocodeForms.get(id, { project: "C8Oforms", rev: rev, token: token });
      var wanted = typeof find === "undefined" || find == null ? "" : String(find).trim();
      if (current && current.fetched === false) {
        result = current;
      } else if (wanted.length) {
        // Only the texts that hold the word, not the whole form.
        var found = C8O.nocodeForms.findText(current, wanted);
        result = { status: "ok", fetched: true, id: String(current._id), rev: String(current._rev), find: wanted, count: found.count, matches: found.matches };
      } else {
        result = { status: "ok", fetched: true, form: C8O.nocodeForms.agentView(current) };
      }
    } catch (e) {
      result = { status: "error", fetched: false, error: { code: "form_read_failed", message: "Unable to read the form through the No Code API." } };
    }'
