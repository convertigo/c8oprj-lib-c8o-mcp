comment: |
  Project JS Get
  Read a helper script from the project's js directory
↓InitContext [steps.SimpleStep-1762350567241]: 
  comment: Validate input and load file content
  expression: |
    'var project = context.project;
    if (!project) { throw new Error("No project context"); }
    var jsDir = new java.io.File(project.getDirPath(), "js");
    var filenameText = filename == null ? "" : String(filename).trim();
    if (!filenameText.length) { throw new Error("filename is required"); }
    var normalized = filenameText.replace(/\\/g, "/");
    while (normalized.indexOf("//") >= 0) { normalized = normalized.replace("//", "/"); }
    if (normalized.startsWith("/")) { normalized = normalized.substring(1); }
    requestedName = normalized;
    var baseFile = jsDir.getCanonicalFile();
    var basePath = baseFile.toPath();
    var targetFile = new java.io.File(baseFile, normalized).getCanonicalFile();
    var targetPath = targetFile.toPath();
    if (!targetPath.startsWith(basePath)) { throw new Error("Invalid filename: " + normalized); }
    directoryExists = jsDir.exists();
    fileExists = targetFile.exists();
    fileCanonicalPath = String(targetFile.getPath());
    fileRelativePath = basePath.relativize(targetPath).toString();
    resultTimestamp = java.lang.System.currentTimeMillis();
    if (fileExists) {
      var bytes = java.nio.file.Files.readAllBytes(targetPath);
      fileContent = new java.lang.String(bytes, java.nio.charset.StandardCharsets.UTF_8);
      resultStatus = "ok";
      resultMessage = "File loaded";
      resultBytes = bytes.length;
    } else {
      fileContent = "";
      resultStatus = directoryExists ? "missing" : "uninitialized";
      resultMessage = directoryExists ? "File not found" : "js directory not created";
      resultBytes = 0;
    }'
