accessibility: Private
comment: |
  Read a project helper script
  Loads one file from the js/ directory of the given project. Use it to inspect helper code before patching it with project-js-set.
↓InitContext [steps.SimpleStep-1762350567241]: 
  comment: Validate input and load file content
  expression: |
    'var projectName = project == null ? "" : String(project).trim();
    if (!projectName.length) { throw new Error("project is required: the technical name of the project whose js/ folder you want to read"); }
    var dboManager = Packages.com.twinsoft.convertigo.engine.Engine.theApp.databaseObjectsManager;
    if (!dboManager.existsProject(projectName)) { throw new Error("Unknown project: " + projectName); }
    var targetProject = dboManager.getOriginalProjectByName(projectName, false);
    var jsDir = new java.io.File(targetProject.getDirPath(), "js");
    var filenameText = filename == null ? "" : String(filename).trim();
    if (!filenameText.length) { throw new Error("filename is required"); }
    include("js/project_js_files.js");
    var resolved = C8O.projectJsFiles.resolve(jsDir, filenameText, projectName, java.io.File);
    requestedName = resolved.name;
    var targetFile = resolved.file;
    var targetPath = targetFile.toPath();
    directoryExists = jsDir.isDirectory();
    fileExists = targetFile.isFile();
    fileCanonicalPath = String(targetFile.getPath());
    fileRelativePath = resolved.name;
    resultTimestamp = java.lang.System.currentTimeMillis();
    if (fileExists) {
      var bytes = java.nio.file.Files.readAllBytes(targetPath);
      fileContent = new java.lang.String(bytes, java.nio.charset.StandardCharsets.UTF_8);
      resultStatus = "ok";
      resultMessage = "File loaded";
      resultBytes = bytes.length;
    } else {
      fileContent = "";
      resultStatus = directoryExists ? "missing" : "uninitialized";
      resultMessage = directoryExists
        ? "File not found: js/" + resolved.name + " of " + projectName + ". " + C8O.projectJsFiles.listText(resolved.base, "js/")
        : "js directory not created: " + projectName + " has no js/ folder yet (project-js-set creates it with its first file).";
      resultBytes = 0;
    }
    if (typeof includeContent !== "undefined" && includeContent != null && String(includeContent).trim().toLowerCase() === "false") {
      fileContent = "";
    }'
