        if (!children) {
            return null;
        }
        var iterator = children.iterator();
        while (iterator.hasNext()) {
            var child = iterator.next();
            var resolved = findStepByName(child, targetName);
            if (resolved) {
                return resolved;
            }
        }
        return null;
