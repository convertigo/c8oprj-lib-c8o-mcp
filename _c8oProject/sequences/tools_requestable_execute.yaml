  comment: Parse request parameters
  expression: |
    'var errors = [];
    var requestText = C8O.util.toTrimmedString(requestable);
    if (!requestText.length) {
        throw new Error(''requestable is required'');
    }
    var parts = requestText.split(''.'');
    if (parts.length < 2) {
        throw new Error(''requestable must be <project>[.<connector>].<requestable>'');
    }
    var projectName = parts[0];
    var targetConnector = null;
    var targetName = null;
    var isSequence = false;
    if (parts.length == 2) {
        isSequence = true;
        targetName = parts[1];
    } else {
        targetConnector = parts[1];
        targetName = parts.slice(2).join(''.'');
    }
    if (!targetName || !targetName.length) {
        throw new Error(''requestable name is missing'');
    }
    var variablesText = C8O.util.toTrimmedString(variables);
    var variablesObject = {};
    if (variablesText.length) {
        try {
            variablesObject = JSON.parse(variablesText);
            if (variablesObject == null || typeof variablesObject !== ''object'' || Array.isArray(variablesObject)) {
                throw new Error();
            }
        } catch (parseError) {
            throw new Error(''variables must be a JSON object: '' + parseError);
        }
    }
    var recordSchemaFlag = false;
    try {
        recordSchemaFlag = C8O.util.toBoolean ? C8O.util.toBoolean(recordSchema, false) : (String(recordSchema || '''').toLowerCase() === ''true'');
    } catch (_ignoreRs) {}
    executionPlan = {
        requestable: requestText,
        project: projectName,
        connector: targetConnector,
        name: targetName,
        isSequence: isSequence,
        variables: variablesObject,
        recordSchema: recordSchemaFlag
    };'
