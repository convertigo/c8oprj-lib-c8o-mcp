comment: |
  Run a sequence or transaction
  Executes a requestable and returns its payload. Pass variables as an object or JSON string; enable includeLogs only for debugging, and use recordSchema only on transactions.
  It runs without an HTTP session or authenticated user: a sequence marked authenticatedContextRequired answers Authentication required. To run it as a signed-in user, pass authenticatedUser (the value the login sequence gives to context.setAuthenticatedUser, for example an email); the user is set for this call only.
