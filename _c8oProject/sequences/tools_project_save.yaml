  expression: include("js/databaseobject.js");
↓Init [steps.SimpleStep-1762445170359]: 
  comment: Resolve project and perform save
  expression: |
    'var Engine = Packages.com.twinsoft.convertigo.engine.Engine;
    
    var providedName = C8O.util.toTrimmedString(project);
    if (!providedName.length && context && context.project) {
      providedName = String(context.project.getName());
    }
    
    var projectRef = null;
    if (providedName.length) {
      try {
        projectRef = Engine.theApp.databaseObjectsManager.getOriginalProjectByName(providedName);
      } catch (_ignoredLookup) {}
    }
    if (projectRef == null && context && context.project) {
      projectRef = context.project;
    }
    
    var resolvedName = projectRef != null ? String(projectRef.getName()) : providedName;
    var errorEntries = [];
    var saveResult = C8O.dbo.saveProject(projectRef, errorEntries);
    
    projectSaveProvided = providedName;
    projectSaveName = resolvedName;
    projectSaveSaved = saveResult.saved === true;
    projectSaveMessage = saveResult.message || "";
    projectSaveTimestamp = java.lang.System.currentTimeMillis();
    projectSaveErrors = errorEntries;
    projectSaveStatus = projectSaveSaved ? "saved" : (projectRef == null ? "missing" : "skipped");
    '
