comment: Renames a database object and optionally refactors references.
↓IncludeHelpers [steps.SimpleStep-1762370249176]: 
  comment: Load shared database helpers
  expression: include("js/databaseobject.js");
↓IncludeOperations [steps.SimpleStep-1762370255465]: 
  comment: Load database object operations helpers
  expression: include("js/databaseobject_ops.js");
↓Init [steps.SimpleStep-1762370265795]: 
  comment: Execute rename operation and gather state
  expression: |
    'var commitFlag = C8O.util.parseCommitFlag(commit, true);
    var renameResult = C8O.dbo.renameObject({ qname: qname, name: name, update: update });
    
    renameInfo = renameResult;
    renameErrors = Array.isArray(renameResult.errors) ? renameResult.errors : [];
    renameCommit = commitFlag;
    renameProject = renameResult.project || null;
    renameExported = false;
    renameExportMessage = "";
    renameRenamed = Boolean(renameResult.renamed);
    renameDone = renameRenamed;
    renameClassName = renameResult.className || "";
    renameQName = renameResult.qname || qname;
    renameNewQName = renameResult.newQName || renameQName;
    renameOldName = renameResult.oldName || "";
    renameNewName = renameResult.newName || name || "";
    renameParentQName = renameResult.parentQName || "";
    renameUpdateMode = renameResult.updateMode || update || "UPDATE_NONE";
    renameUpdatedIds = Array.isArray(renameResult.updatedIds) ? renameResult.updatedIds : [];
    renameProjectName = renameResult.projectName || "";
    renameShouldRefresh = renameRenamed && renameParentQName.length > 0;
    renameSummaryRenamed = renameRenamed ? 1 : 0;
    renameSummaryErrors = renameErrors.length;'
↓Export [steps.SimpleStep-1762370273289]: 
  comment: Export project if requested
  expression: |
    var exportResult = C8O.dbo.exportProjectIfNeeded(renameProject, renameCommit, renameErrors);
    renameExported = exportResult.exported;
    renameExportMessage = exportResult.message || "";
↓IfRefreshParent [steps.IfStep-1762370280715]: 
  comment: Refresh parent folder when renamed
  condition: renameShouldRefresh
  ↓PrepareRefresh [steps.SimpleStep-1762370286279]: 
    comment: Save current qname and point to parent
    expression: |
      'previousRefreshQNameDefined = typeof qname !== "undefined" && qname !== null;
      previousRefreshQNameValue = previousRefreshQNameDefined ? qname : null;
      qname = renameParentQName;'
  ↓RefreshParent [steps.SequenceStep-1762370291970]: 
    comment: Invoke Studio refresh for parent
    sourceSequence: ConvertigoMCP.internal_studio_refresh
  ↓RestoreRefreshScope [steps.SimpleStep-1762370298194]: 
    comment: Restore original qname after refresh
    expression: |
      'if (previousRefreshQNameDefined) {
        qname = previousRefreshQNameValue;
      } else {
        qname = null;
      }
      previousRefreshQNameDefined = false;
      previousRefreshQNameValue = null;'
