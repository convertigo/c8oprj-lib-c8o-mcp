accessibility: Private
comment: |
  Sign the Studio browser in as an account of the application
  Studio only. Signs the Studio browser (the browser of your Playwright tools and of browser-verify) in as the account you name, without its password, then opens the page asked: use it to check the pages behind the sign-in of the app you change. Takes the project, the account (its login or e-mail, from the project notes, the brief or the user) and the route segment to open; url is the viewerHomeUrl of mobile-builder-open when the browser does not show the app yet. The app's own sign-in sequence does not run, so what it stores besides the user is not set. Never guess, crack or reset a password instead.
responseTimeout: 60
↓Include [steps.SimpleStep-1794900000201]: 
  expression: 'include("js/mcp_auth.js"); include("js/viewer_session.js");'
↓Run [steps.SimpleStep-1794900000202]: 
