↓Init [steps.SimpleStep-1762963032300]: 
  comment: Parse requested level and prepare response
  expression: |
    'var logLevelInfo = { requested: "", normalized: "", applied: "", success: true, message: "" };
    var parsedParams = {};
    try { if (paramsJson && paramsJson.length) { parsedParams = JSON.parse(paramsJson); } } catch (e) { logLevelInfo.success = false; logLevelInfo.message = "Invalid params JSON"; }
    var requested = "";
    if (parsedParams && typeof parsedParams.level === "string") { requested = parsedParams.level.trim(); }
    logLevelInfo.requested = requested;
    var allowed = { trace: "TRACE", debug: "DEBUG", info: "INFO", warn: "WARN", warning: "WARN", error: "ERROR" };
    var normalized = "";
    if (requested && allowed[requested.toLowerCase()]) { normalized = allowed[requested.toLowerCase()]; } else if (!logLevelInfo.message) { logLevelInfo.message = requested ? "Unsupported level (accepted: trace, debug, info, warn, error)" : "No level provided"; logLevelInfo.success = false; }
    if (!normalized) { normalized = "INFO"; }
    logLevelInfo.normalized = normalized;
    logLevelInfo.applied = normalized;
    if (!logLevelInfo.message) { logLevelInfo.message = "Logging level accepted"; }'
