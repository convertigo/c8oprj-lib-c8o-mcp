accessibility: Private
comment: |
  Update a No Code form through C8Oforms APIs
  Fetches the form through C8Oforms.APIV2_getDocument, applies a JSON merge patch, validates it, then persists only through C8Oforms.APIV2_updateFormulaireDocument.
↓Run [steps.SimpleStep-1780100000401]: 
  expression: |
    'include("js/nocode_forms.js");
    include("js/ui_reveal.js");
    var patchObject = C8O.nocodeForms.parseObject(patch, "patch", {});
    result = C8O.nocodeForms.update(id, patchObject, { project: project, rev: rev, token: token });
    if (result && C8O.uiReveal && C8O.uiReveal.enabled((typeof reveal !== "undefined") ? reveal : false, false) === true) {
      result.reveal = C8O.uiReveal.nocodeForm("nocode-form-update-reveal", result, { project: project });
    }'
