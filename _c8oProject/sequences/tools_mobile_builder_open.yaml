accessibility: Private
comment: |
  Start, poll, or reconnect to the NGX mobile builder
  Starts or reconnects to the NGX builder and returns readiness diagnostics plus viewerBaseUrl, viewerHomeUrl, viewerUrl, browserDebugUrl/browserDevToolsJsonUrl/browserDevToolsWebSocketUrl when a Studio JxBrowser viewer is available, and structured compileErrors. By default wait=true preserves synchronous readiness. Set wait=false to launch asynchronously and return the current state immediately. Set stateOnly=true to read current viewer URLs/state without opening or restarting the builder. Use viewerHomeUrl or viewerBaseUrl for the live dev app; reserve DisplayObjects/mobile/home for production builds. Studio JxBrowser exposes one visible CDP target; reuse the current target and do not create a new browser tab or page. Use forceRestart only when the current builder is stuck or on the wrong state.
responseTimeout: 120
↓IncludeHelpers [steps.SimpleStep-1772733052615]: 
  comment: Start builder and collect readiness/log data.
  expression: include("js/tools_mobile_builder_open.js");
↓result [steps.JsonToXmlStep-1772733052767]: 
  jsonObject: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: JS
        - →→: openMobileBuilderResult
  key: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: PLAIN
        - →→: result
↓project [variables.RequestableVariable-1772733052953]: 
  comment: Existing NGX project name.
  description: Existing NGX project name.
↓timeoutSec [variables.RequestableVariable-1772733053163]: 
  comment: Seconds to wait for readiness when wait=true. Use 0 for a non-blocking poll. Default 90; max 600.
  description: Seconds to wait for readiness when wait=true. Use 0 for a non-blocking poll. Default 90; max 600.
  value: 90
↓logsLimit [variables.RequestableVariable-1772733053321]: 
  comment: Maximum builder log lines returned for diagnostics. Default 40; max 200.
  description: Maximum builder log lines returned for diagnostics. Default 40; max 200.
  value: 40
↓forceRestart [variables.RequestableVariable-1772733053490]: 
  comment: Set true to restart an already running builder. Use only when the current builder is stuck or on the wrong state.
  description: Set true to restart an already running builder. Use only when the current builder is stuck or on the wrong state.
  value: false
↓wait [variables.RequestableVariable-1782883416965]: 
  comment: Set false to request/open the viewer and return immediately with the current state. Default true preserves the synchronous readiness wait.
  description: Set false to request/open the viewer and return immediately with the current state. Default true preserves the synchronous readiness wait.
  value: true
↓stateOnly [variables.RequestableVariable-1782883417004]: 
  comment: Set true to read the current viewer/editor state and URLs without opening, starting, or restarting the builder.
  description: Set true to read the current viewer/editor state and URLs without opening, starting, or restarting the builder.
  value: false
↓reveal [variables.RequestableVariable-1782955200201]: 
  comment: Set true to request visible Studio focus on the mobile builder/editor when opening or polling it.
  description: Set true to request visible Studio focus on the mobile builder/editor when opening or polling it.
  value: false
