  expression: include("js/databaseobject_ops.js");
↓Init [steps.SimpleStep-1762369937820]: 
  comment: Prepare move operation and shared state
  expression: |
    'var commitFlag = C8O.util.parseCommitFlag(commit, true);
    var moveResult = C8O.dbo.moveObject({ qname: qname, target: target, position: position });
    
    moveInfo = moveResult;
    moveErrors = Array.isArray(moveResult.errors) ? moveResult.errors : [];
    moveCommit = commitFlag;
    moveProject = moveResult.project || null;
    moveExported = false;
    moveExportMessage = "";
    moveDone = Boolean(moveResult.done);
    moveMoved = Boolean(moveResult.moved);
    moveReordered = Boolean(moveResult.reordered);
    moveClassName = moveResult.className || "";
    moveQName = moveResult.qname || qname;
    moveName = moveResult.name || "";
    moveFromParent = moveResult.fromParent || "";
    moveToParent = moveResult.toParent || "";
    movePosition = moveResult.position || position || "inside";
    moveAfter = moveResult.after != null ? moveResult.after : null;
    moveProjectName = moveResult.projectName || "";
    moveShouldRefreshFrom = moveDone && moveFromParent.length > 0;
    moveShouldRefreshTo = moveDone && moveToParent.length > 0 && moveToParent !== moveFromParent;
    moveSummaryMoved = moveMoved ? 1 : 0;
    moveSummaryReordered = moveReordered ? 1 : 0;
    moveSummaryErrors = moveErrors.length;'
↓Export [steps.SimpleStep-1762369943166]: 
  comment: Export project if requested
  expression: |
    var exportResult = C8O.dbo.exportProjectIfNeeded(moveProject, moveCommit, moveErrors);
    moveExported = exportResult.exported;
    moveExportMessage = exportResult.message || "";
