    resultQName = refreshResult && refreshResult.qname ? String(refreshResult.qname) : (qname == null ? "" : String(qname));
    resultStudioMode = refreshResult ? refreshResult.studioMode === true : false;
    refreshExecuted = refreshResult ? refreshResult.executed === true : false;'
