↓InitContext [steps.SimpleStep-1762342576346]: 
  comment: Refresh Project Explorer using shared helper
  expression: |
    'var refreshResult = C8O.dbo.refreshStudioTreeByQName(qname);
    resultTimestamp = refreshResult && refreshResult.timestamp ? refreshResult.timestamp : java.lang.System.currentTimeMillis();
    resultStatus = refreshResult && refreshResult.status ? String(refreshResult.status) : "error";
    resultMessage = refreshResult && refreshResult.message ? String(refreshResult.message) : "";
    resultError = refreshResult && refreshResult.error ? String(refreshResult.error) : "";
    resultRefreshed = refreshResult ? refreshResult.refreshed === true : false;
    resultRefreshedQName = refreshResult && refreshResult.refreshedQName ? String(refreshResult.refreshedQName) : "";
    resultTargetQName = refreshResult && refreshResult.targetQName ? String(refreshResult.targetQName) : "";
    resultQName = refreshResult && refreshResult.qname ? String(refreshResult.qname) : (qname == null ? "" : String(qname));
    resultStudioMode = refreshResult ? refreshResult.studioMode === true : false;
    refreshExecuted = refreshResult ? refreshResult.executed === true : false;'
