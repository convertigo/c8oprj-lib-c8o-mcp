accessibility: Private
comment: |
  Apply a No Code Baserow schema
  Authenticates with the No Code Studio token, then plans or applies workspace/base/table/field/link/lookup/view/sample-row changes through lib_BaseRow requestables and its Baserow connector.
responseTimeout: 300
↓Run [steps.SimpleStep-1780481728024]: 
  expression: |
    'include("js/nocode_baserow.js");
    include("js/nocode_form_write_job.js");
    var writeJob = C8O.nocodeFormWriteJob;
    var askedApplyId = writeJob.jobIdOf(typeof applyId !== "undefined" ? applyId : null);
    var applyInput = {
      mode: typeof mode === "undefined" ? "plan" : mode,
      schema: typeof schema === "undefined" ? "{}" : schema,
      create: typeof create === "undefined" ? "{}" : create,
      readBack: typeof readBack === "undefined" ? true : readBack,
      view: typeof view === "undefined" ? "" : view
    };
    var applyToken = C8O.nocodeBaserow.callerToken({ token: token });
    var writeOwner = writeJob.owner(applyToken);
    // the schema and create as values of this scope (a Java string is no JSON value), or null when they are no JSON:
    // that apply fails at once in the call, as it did, and nothing runs in a thread
    var applyValues = askedApplyId.length ? {} : null;
    if (!askedApplyId.length) {
      try {
        applyValues = {};
        ["schema", "create"].forEach(function (key) {
          var raw = applyInput[key];
          applyValues[key] = raw != null && typeof raw === "object" && typeof raw.getClass !== "function" ? raw : JSON.parse(String(raw == null || String(raw).trim() === "" ? "{}" : raw));
        });
      } catch (_notJson) {
        applyValues = null;
      }
    }
    if (!writeOwner.length || !applyValues || (!askedApplyId.length && String(applyInput.mode == null ? "" : applyInput.mode).trim().toLowerCase() !== "apply")) {
      // nothing to run in a thread: no bearer (auth_required), a schema that is no JSON, or a plan, which writes nothing
      applyInput.token = applyToken;
      result = C8O.nocodeBaserow.schemaApply(applyInput);
    } else {
      // the apply runs in a thread of its own: past the time an agent waits, it answers running with its applyId
      applyInput.schema = applyValues.schema;
      applyInput.create = applyValues.create;
      applyInput.mode = String(applyInput.mode);
      applyInput.readBack = String(applyInput.readBack);
      applyInput.view = String(applyInput.view);
      var writeHost = writeJob.javaHost(context);
      C8O.detachedRequest = writeHost.detachedRequest;
      result = writeJob.run({ kind: "schema", input: applyInput, jobId: askedApplyId, owner: writeOwner, options: { token: applyToken } }, writeHost);
    }'
