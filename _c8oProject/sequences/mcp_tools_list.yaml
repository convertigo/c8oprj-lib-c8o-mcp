↓Init [steps.SimpleStep-1762960828140]: 
  comment: Prepare tool list and pagination
  expression: |
    'var Engine = Packages.com.twinsoft.convertigo.engine.Engine;
    var feedbackMode = String(C8O.reporting.resolveMode());
    var mcpAuthKind = typeof authKind === "undefined" || authKind === null ? "" : String(authKind);
    var limitText = limit == null ? "" : String(limit).trim();
    var maxLimit = 500;
    var limitValue = 0;
    if (limitText.length > 0) {
      try {
        var parsedLimit = parseInt(limitText, 10);
        if (!isNaN(parsedLimit)) {
          limitValue = parsedLimit;
        }
      } catch (_ignoredLimit) {}
    }
    if (limitValue < 0) { limitValue = 0; }
    if (limitValue > maxLimit) { limitValue = maxLimit; }
    
    var cursorRaw = "";
    if (typeof _nextCursor !== "undefined" && _nextCursor !== null) {
      var cursorText = String(_nextCursor).trim();
      if (cursorText.length && cursorText.toLowerCase() !== "undefined" && cursorText.indexOf("org.mozilla.javascript.Undefined") !== 0) {
        cursorRaw = cursorText;
      }
    }
    var startIndex = 0;
    if (cursorRaw.length > 0) {
      try {
        var parsedCursor = parseInt(cursorRaw, 10);
        if (!isNaN(parsedCursor) && parsedCursor >= 0) {
          startIndex = parsedCursor;
        }
      } catch (_ignoredCursor) {}
    }
    
    var toolNames = [];
    try {
      var sequences = context.project.getSequencesList();
      var iterator = sequences.iterator();
      while (iterator.hasNext()) {
        var seq = iterator.next();
        if (!seq) { continue; }
        try {
          var seqName = seq.getName();
          if (seqName && seqName.startsWith("tools_")) {
            if (mcpAuthKind === "nocode" && seqName.indexOf("tools_nocode_") !== 0) {
              continue;
            }
            if (feedbackMode == "off" && seqName == "tools_report_create") {
              continue;
            }
            toolNames.push(seqName);
          }
        } catch (_ignoredName) {}
      }
    } catch (_ignoredSequences) {}
    
    var totalCount = toolNames.length;
    if (startIndex < 0) { startIndex = 0; }
    if (startIndex > totalCount) { startIndex = totalCount; }
    var endIndex = limitValue > 0 ? Math.min(totalCount, startIndex + limitValue) : totalCount;
    var windowList = toolNames.slice(startIndex, endIndex);
    var hasMore = limitValue > 0 && endIndex < totalCount;
    var nextCursorValue = hasMore ? String(endIndex) : "";
    
    toolNamesWindow = windowList;
    toolsTotalCount = totalCount;
    toolsStartIndex = startIndex;
    toolsLimitValue = limitValue;
    toolsLimitOutput = limitValue > 0 ? limitValue : null;
    toolsReturnedCount = windowList.length;
    toolsCursorInput = cursorRaw;
    toolsHasMore = hasMore;
    toolsNextCursor = nextCursorValue;'
