accessibility: Private
comment: |
  Create an NGX page with the Basic presentation patterns
  Creates a list, detail, form or dashboard page from a page spec: page-enter event with locals and a CallSequenceAction of its facade, lost-session redirect, record lists, label/value lists, KPI grid, UIForm with Form SmartSources, toast and navigation, local?.x templates, and the AppLayout style created or completed. All or nothing.
↓Include [steps.SimpleStep-1792270100034]: 
  expression: include("js/tools_generators_ngx.js");
↓Run [steps.SimpleStep-1792270100035]: 
  expression: 'var generatorResult = C8O.generators.ngxPageCreate({project: project, name: name, title: title, kind: kind, facade: facade, params: params, vars: vars, filters: filters, filterLabel: filterLabel, list: list, detail: detail, form: form, dashboard: dashboard, actions: actions, authRedirect: authRedirect, authCodes: authCodes, heading: heading, inMenu: inMenu, segment: segment, icon: icon, locals: locals, home: home});'
↓result [steps.JsonToXmlStep-1792270100036]: 
  jsonObject: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: JS
        - →→: generatorResult
  key: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: PLAIN
        - →→: result
