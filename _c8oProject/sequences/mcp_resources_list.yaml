↓LoadResources [steps.SimpleStep-1762971672119]: 
  comment: Load resources catalog page
  expression: |
    'var catalog = c8oLoadResourcesIndex();
    var pageSize = 25;
    var cursorText = C8O.util.toTrimmedString(cursor || "");
    if (!cursorText.length && typeof _nextCursor !== "undefined") {
      var metaCursor = C8O.util.toTrimmedString(_nextCursor);
      if (metaCursor.length) {
        cursorText = metaCursor;
      }
    }
    var startIndex = 0;
    if (cursorText.length) {
      var parsedCursor = parseInt(cursorText, 10);
      if (!isNaN(parsedCursor) && parsedCursor >= 0) {
        startIndex = parsedCursor;
      }
    }
    var slice = catalog.slice(startIndex, startIndex + pageSize);
    var nextCursor = "";
    if (startIndex + slice.length < catalog.length) {
      nextCursor = String(startIndex + slice.length);
    }
    resourcesPage = slice;
    resourcesNextCursor = nextCursor;
    resourcesQuery = {
      total: catalog.length,
      startIndex: startIndex,
      limit: pageSize,
      returned: slice.length,
      cursorInput: cursorText
    };'
