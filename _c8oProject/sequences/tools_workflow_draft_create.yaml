accessibility: Private
comment: |
  Create a workflow draft
  Creates a new workflow as a draft, never published: blank (a minimal valid skeleton), from a template (templateKey from workflow-list), from a whole definition, or from a published No Code Studio form (fromForm with C8Oforms: the fields of the form, the form as start form, a circuit approval or two-levels). Without workflowKey the key of the template is kept when free, else one is derived from the title. Answers the draft as workflow-get does. Designers only. Acts as the user of the MCP token, with the roles the workflow engine gives that user. Needs lib_WorkflowEngine.
↓Run [steps.SimpleStep-1794200000009]: 
  expression: |
    'include("js/mcp_auth.js");
    include("js/workflow_tools.js");
    result = C8O.workflowTools.draftCreate({
      title: typeof title === "undefined" ? null : title,
      workflowKey: typeof workflowKey === "undefined" ? null : workflowKey,
      description: typeof description === "undefined" ? null : description,
      templateKey: typeof templateKey === "undefined" ? null : templateKey,
      definition: typeof definition === "undefined" ? null : definition,
      fromForm: typeof fromForm === "undefined" ? null : fromForm,
      circuit: typeof circuit === "undefined" ? null : circuit,
      language: typeof language === "undefined" ? null : language
    });'
↓result [steps.JsonToXmlStep-1794200000010]: 
  jsonObject: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: JS
        - →→: result
  key: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: PLAIN
        - →→: result
