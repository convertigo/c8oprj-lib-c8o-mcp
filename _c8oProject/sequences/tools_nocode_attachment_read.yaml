  comment: 'File name of the attachment, as the user''s message lists it (liste.xlsx). Omit it to list the user''s attachments.'
  description: 'File name of the attachment, as the user''s message lists it (liste.xlsx). Omit it to list the user''s attachments.'
↓sheet [variables.RequestableVariable-1794850000005]: 
  comment: 'Spreadsheet only: the sheet to read, by its name or its number from 1. The first visible sheet by default.'
  description: 'Spreadsheet only: the sheet to read, by its name or its number from 1. The first visible sheet by default.'
↓offset [variables.RequestableVariable-1794850000006]: 
  comment: 'Rows of the sheet (after its header) or characters of the document to skip: the nextOffset of the previous answer. 0 by default.'
  description: 'Rows of the sheet (after its header) or characters of the document to skip: the nextOffset of the previous answer. 0 by default.'
