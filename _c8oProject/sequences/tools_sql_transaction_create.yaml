accessibility: Private
comment: |
  Create SQL transactions with the SQL guide rules built in
  Creates one or several SqlTransaction objects from SQL text or a structured select/insert/update/delete spec, declares their variables and checks the rules of the SQL guide (quoted camelCase aliases, optional filters, list filters with POSITION, date units). All or nothing.
↓Include [steps.SimpleStep-1792270100001]: 
  expression: include("js/tools_generators.js");
↓Run [steps.SimpleStep-1792270100002]: 
  expression: 'var generatorResult = C8O.generators.sqlTransactionCreate({project: project, connector: connector, name: name, sql: sql, select: select, insert: insert, update: update, "delete": deleteFrom, variables: variables, autoCommit: autoCommit, maxResult: maxResult, comment: comment, transactions: transactions, ifExists: ifExists});'
↓result [steps.JsonToXmlStep-1792270100003]: 
  jsonObject: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: JS
        - →→: generatorResult
  key: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: PLAIN
        - →→: result
