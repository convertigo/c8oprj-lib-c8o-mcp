↓Init [steps.SimpleStep-1762268328547]: 
  comment: Apply property updates
  expression: |
    'var dbo = C8O.dbo.resolve(qname, { messagePrefix: "qname" });
    var projectRef = dbo.getProject ? dbo.getProject() : null;
    
    var appliedEntries = [];
    var skippedEntries = [];
    var errorEntries = [];
    
    var updates = C8O.dbo.parsePropertyUpdates(properties, errorEntries);
    var autoSaveFlag = C8O.util.parseAutoSaveFlag(autoSave, true);
    
    var mutation = C8O.dbo.applyUpdatesAndPersist({
      dbo: dbo,
      project: projectRef,
      updates: updates,
      errors: errorEntries,
      autoSave: autoSaveFlag,
      persistIfNoUpdate: false
    });
    
    appliedEntries = mutation.applied || [];
    skippedEntries = mutation.skipped || [];
    errorEntries = mutation.errors || errorEntries;
    
    var savedFlag = mutation.saved === true;
    var mobileBuilderRefresh = mutation.mobileBuilderRefresh || { requested: false, studioMode: false, mobileObject: false, triggered: false, message: "" };
    
    var parentQNameText = "";
    try {
      var parentRef = dbo.getParent ? dbo.getParent() : null;
      if (parentRef != null) {
        parentQNameText = String(parentRef.getQName ? parentRef.getQName() : parentRef.getFullQName());
      }
    } catch (_ignoreParentQName) {
      parentQNameText = "";
    }
    
    var shouldRefreshTree = (mutation.changed === true) && parentQNameText.length > 0 && C8O.dbo.hasAppliedProperty(appliedEntries, ["name"]);
    
    var summaryInfo = {
      updated: appliedEntries.length,
      skipped: skippedEntries.length,
      errors: errorEntries.length,
      keys: Object.keys(updates || {}).join(","),
      autoSave: autoSaveFlag,
      saved: savedFlag,
      saveMessage: mutation.saveResult ? (mutation.saveResult.message || "") : "",
      mobileBuilderTriggered: mobileBuilderRefresh.triggered === true,
      mobileBuilderMessage: mobileBuilderRefresh.message || ""
    };
    
    updatedEntries = appliedEntries;
    skippedEntriesOut = skippedEntries;
    errorEntriesOut = errorEntries;
    targetClassName = C8O.util.fromFqcn ? C8O.util.fromFqcn(dbo.getClass().getName()) : dbo.getClass().getName();
    autoSaveApplied = autoSaveFlag;
    saved = savedFlag;
    mobileBuilderRefreshInfo = mobileBuilderRefresh;
    summary = summaryInfo;
    propertiesSetRefreshParentQName = parentQNameText;
    propertiesSetShouldRefreshTree = shouldRefreshTree;
    '
