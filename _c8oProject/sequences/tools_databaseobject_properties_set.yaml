↓Init [steps.SimpleStep-1762268328547]: 
  comment: Apply property updates
  expression: |
    'var dbo = C8O.dbo.resolve(qname, { messagePrefix: "qname" });
    var projectRef = dbo.getProject ? dbo.getProject() : null;
    
    var appliedEntries = [];
    var skippedEntries = [];
    var errorEntries = [];
    
    var updates = C8O.dbo.parsePropertyUpdates(properties, errorEntries);
    var autoSaveFlag = C8O.util.parseAutoSaveFlag(autoSave, true);
    
    if (updates && Object.keys(updates).length > 0) {
      var applyResult = C8O.dbo.applyPropertyUpdates(dbo, updates);
      appliedEntries = applyResult.applied;
      skippedEntries = applyResult.skipped;
      if (applyResult.errors.length) {
        Array.prototype.push.apply(errorEntries, applyResult.errors);
      }
    }
    
    var mobileBuilderRefresh = { requested: false, studioMode: false, mobileObject: false, triggered: false, message: "" };
    var saveResult = { saved: false, message: "" };
    if (appliedEntries.length > 0) {
      dbo.hasChanged = true;
      if (projectRef != null) { projectRef.hasChanged = true; }
      mobileBuilderRefresh = C8O.dbo.triggerMobileBuilderRefresh(dbo, errorEntries);
      saveResult = C8O.dbo.saveProjectIfNeeded(projectRef, autoSaveFlag, errorEntries);
    }
    
    var savedFlag = saveResult.saved === true;
    var summaryInfo = {
      updated: appliedEntries.length,
      skipped: skippedEntries.length,
      errors: errorEntries.length,
      keys: Object.keys(updates || {}).join(","),
      autoSave: autoSaveFlag,
      saved: savedFlag,
      saveMessage: saveResult.message || "",
      mobileBuilderTriggered: mobileBuilderRefresh.triggered === true,
      mobileBuilderMessage: mobileBuilderRefresh.message || ""
    };
    
    updatedEntries = appliedEntries;
    skippedEntriesOut = skippedEntries;
    errorEntriesOut = errorEntries;
    targetClassName = C8O.util.fromFqcn ? C8O.util.fromFqcn(dbo.getClass().getName()) : dbo.getClass().getName();
    autoSaveApplied = autoSaveFlag;
    saved = savedFlag;
    mobileBuilderRefreshInfo = mobileBuilderRefresh;
    summary = summaryInfo;'
