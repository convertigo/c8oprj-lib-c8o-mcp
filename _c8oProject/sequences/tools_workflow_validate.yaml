accessibility: Private
comment: |
  Validate a workflow definition
  Runs the validator of lib_WorkflowEngine (the Check of the Workflow Studio) on the saved draft (workflowKey) or on a definition not saved (definition): errors, which block publication, and warnings, each with the path of the option, and a summary (states, transitions, fields, roles). Designers only. Acts as the user of the MCP token, with the roles the workflow engine gives that user. Needs lib_WorkflowEngine.
