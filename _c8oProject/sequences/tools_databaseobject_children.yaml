↓Sequence_JS [steps.SimpleStep-1762271829926]: 
  comment: Collect children metadata
  expression: |
    'var Engine = Packages.com.twinsoft.convertigo.engine.Engine;
    var XMLUtils = Packages.com.twinsoft.convertigo.engine.util.XMLUtils;
    var GetChildren = Packages.com.twinsoft.convertigo.engine.admin.services.database_objects.GetChildren;
    
    var manager = Engine.theApp.databaseObjectsManager;
    var sourceQName = qname ? String(qname).trim() : "";
    var doc = XMLUtils.getDefaultDocumentBuilder().newDocument();
    var root = doc.createElement("children");
    doc.appendChild(root);
    
    if (sourceQName.length > 0) {
      GetChildren.getChildren(sourceQName, root, 1);
    } else {
      var names = Engine.theApp.databaseObjectsManager.getAllProjectNamesList();
      for (var i = 0; i < names.size(); i++) {
        GetChildren.getChildren(names.get(i), root, 0);
      }
    }
    
    function toBoolean(value) {
      if (value === null || value === undefined) {
        return null;
      }
      return String(value) === "true";
    }
    
    function mapAttributes(node) {
      if (!node) {
        return null;
      }
      var attr = node.attr || {};
      var shortQName = attr.qname || "";
      var resolvedQName = shortQName;
      if (shortQName.length > 0) {
        try {
          var dbo = manager.getDatabaseObjectByQName(shortQName);
          if (dbo != null) {
            resolvedQName = String(dbo.getFullQName());
          }
        } catch (e) {
          resolvedQName = shortQName;
        }
      }
      var priority = attr.priority !== undefined ? Number(attr.priority) : 0;
      if (isNaN(priority)) {
        priority = 0;
      }
      var enabledFlag = toBoolean(attr.isEnabled);
      if (enabledFlag === null) {
        enabledFlag = false;
      }
      var inheritedFlag = toBoolean(attr.isInherited);
      if (inheritedFlag === null) {
        inheritedFlag = false;
      }
      return {
        qname: resolvedQName,
        name: attr.name || "",
        category: attr.category || "",
        comment: attr.comment || "",
        beanClass: attr.beanClass || "",
        priority: priority,
        hasChildren: toBoolean(attr.hasChildren) === true,
        isEnabled: enabledFlag,
        isInherited: inheritedFlag
      };
    }
    
    function asArray(value) {
      if (!value) {
        return [];
      }
      return Array.isArray(value) ? value : [value];
    }
    
    var json = JSON.parse(XMLUtils.XmlToJson(root, true, true));
    var rawChildren = [];
    var parentNode = null;
    
    if (sourceQName.length > 0) {
      if (json.children && json.children.dbo) {
        parentNode = json.children.dbo;
        rawChildren = asArray(parentNode.dbo);
      }
    } else if (json.children && json.children.dbo) {
      rawChildren = asArray(json.children.dbo);
    }
    
    var mappedChildren = [];
    for (var idx = 0; idx < rawChildren.length; idx++) {
      var mapped = mapAttributes(rawChildren[idx]);
      if (mapped) {
        mappedChildren.push(mapped);
      }
    }
    
    queryData = {
      qname: sourceQName,
      hasParent: sourceQName.length > 0,
      total: mappedChildren.length
    };
    parentData = mapAttributes(parentNode);
    childrenData = mappedChildren;
    '
