    var filterRaw = filter == null ? '''' : String(filter);
    var filterText = filterRaw.trim();
    var hasFilter = filterText.length > 0;
    if (hasFilter) {
      filterText = filterText.toLowerCase();
    }
    
    var locale = Locale.getDefault();
    var df = DateFormat.getDateTimeInstance(DateFormat.SHORT, DateFormat.SHORT, locale);
    var dbom = Engine.theApp.databaseObjectsManager;
    var names = dbom.getAllProjectNamesList();
    var projectsList = new java.util.ArrayList();
    var totalProjects = 0;
    var skippedTemplates = 0;
    
    for (var i = 0; i < names.size(); i++) {
      var projectName = names.get(i);
      var isTemplate = projectName != null && projectName.startsWith(''mobilebuilder_tpl_'');
      if (!includeTemplatesFlag && isTemplate) { skippedTemplates++; continue; }
      try {
        var project = dbom.getOriginalProjectByName(projectName);
        if (project == null) { continue; }
        var comment = project.getComment();
        if (comment == null) { comment = ''''; }
        try {
          var json = new JSONObject(comment);
          var localeKey = locale.getLanguage();
          var block = null;
          if (json.has(localeKey)) { block = json.getJSONObject(localeKey); }
          else {
            var keys = json.keys();
            if (keys.hasNext()) {
              block = json.getJSONObject(keys.next().toString());
            }
          }
          if (block != null) {
            comment = project.getName();
            if (block.has(''displayName'')) { comment = block.getString(''displayName''); }
            if (block.has(''comment'')) { comment = comment + '': '' + block.getString(''comment''); }
          }
        } catch(ignore) {}
        comment = comment.replaceAll(''<.*?>'', '''');
        if (comment.length() > 200) { comment = comment.substring(0, 197) + ''...''; }
    
        if (hasFilter) {
          var nameLower = projectName != null ? projectName.toLowerCase() : '''';
          var commentLower = comment != null ? comment.toLowerCase() : '''';
          if (nameLower.indexOf(filterText) == -1 && commentLower.indexOf(filterText) == -1) {
            continue;
          }
        }
    
        var carFile = new File(Engine.projectDir(projectName) + ''.car'');
        var deployTs = carFile.exists() ? carFile.lastModified() : -1;
        var deployDate = deployTs > 0 ? df.format(new Date(deployTs)) : ''n/a'';
        var exportedInfo = project.getInfoForProperty(''exported'', df, locale);
        var exportedTs = project.getExportTime();
        var projectMap = new java.util.LinkedHashMap();
        projectMap.put(''name'', projectName);
        projectMap.put(''comment'', comment);
        projectMap.put(''version'', project.getVersion());
        projectMap.put(''exported'', exportedInfo != null ? String(exportedInfo) : ''n/a'');
        projectMap.put(''exportedTs'', exportedTs > 0 ? java.lang.Long.valueOf(exportedTs) : null);
        projectMap.put(''deployDate'', deployDate);
        projectMap.put(''deployTs'', deployTs > 0 ? java.lang.Long.valueOf(deployTs) : null);
        projectMap.put(''hasUndefinedSymbols'', java.lang.Boolean.valueOf(dbom.symbolsProjectCheckUndefined(projectName)));
        projectMap.put(''isTemplate'', java.lang.Boolean.valueOf(isTemplate));
        var missingDependencies = false;
        var references = project.getReferenceList();
        for (var r = 0; r < references.size(); r++) {
          var ref = references.get(r);
          if (ref instanceof Packages.com.twinsoft.convertigo.beans.references.ProjectSchemaReference) {
            var pr = ref;
            if (pr.getParser().isValid() && dbom.getOriginalProjectByName(pr.getParser().getProjectName(), true) == null) {
              missingDependencies = true;
              break;
            }
          }
        }
        projectMap.put(''missingDependencies'', java.lang.Boolean.valueOf(missingDependencies));
        projectsList.add(projectMap);
        totalProjects++;
      } catch(e) {
        log.warn(''[MCP] AdminListProjects error for project '' + projectName + '' '' + e);
      }
    }
    
    var summary = new java.util.LinkedHashMap();
    summary.put(''total'', java.lang.Integer.valueOf(totalProjects));
    summary.put(''skippedTemplates'', java.lang.Integer.valueOf(skippedTemplates));
    summary.put(''includeTemplates'', java.lang.Boolean.valueOf(includeTemplatesFlag));
    summary.put(''filter'', hasFilter ? filterRaw : '''');
    summary.put(''timestamp'', java.lang.Long.valueOf(java.lang.System.currentTimeMillis()));
    
    projectsList = projectsList;
    summary = summary;'
