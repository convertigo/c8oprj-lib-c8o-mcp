accessibility: Private
comment: |
  Lint a project for known build pitfalls
  Read-only pass over one project for pitfalls that break a Convertigo app silently or at run time: SQL (a variable inside a string literal, date arithmetic without a unit, IN with a multivalued variable, unquoted aliases), sequences (context.get on a sequence variable, writes whose errors are never read) and NGX pages (c8oPage in templates, scope in custom actions, glued texts, i18n keys shown as text, texts without accents, callJson in page scripts). Each finding gives the rule, the QName, what breaks and the fix. Run it before a build and before calling a lot done.
