accessibility: Private
comment: |
  Copy an object and everything under it
  Copies an existing object (a page, a shared component, a sequence, a step and its children, a transaction...) inside or next to a target, in the same project or another one, in one call: every property comes with it, and the priorities of the copied objects and the sources that name them inside the copy are renewed, so the copy runs on its own steps and components. To start from a model or an existing object, copy it, then adapt the copy with databaseobject-tree-apply: never rebuild it from tree-get reads. A name already taken under the target parent is refused. References to the source project stay unless retargetProject is true; the answer lists what the copy still reads outside itself. Saves the project.
↓Include [steps.SimpleStep-1795100000101]: 
  expression: 'include("js/databaseobject.js"); include("js/databaseobject_ops.js"); include("js/tools_databaseobject_copy.js");'
↓Run [steps.SimpleStep-1795100000102]: 
  expression: 'var databaseobjectCopyResult = C8O.dboCopy.run({source: source, target: target, at: at, name: name, retargetProject: retargetProject, autoSave: autoSave});'
