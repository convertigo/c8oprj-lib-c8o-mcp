accessibility: Private
comment: |
  Read workflow requests
  With instanceId: one request as the token user sees it (its state, data, the screen of its step: actions the user can do, sections, notices, progress, how the step is done; next; permissions; history). Otherwise the requests of a list: scope inbox (the tasks of the user and of its roles, default), started, involved or all (WorkflowAdmin, or the readers of one workflow), filtered by workflow, status, state, business key or a search, 20 per page. Read-only: never starts or moves a request. Acts as the user of the MCP token, with the roles the workflow engine gives that user. Needs lib_WorkflowEngine.
