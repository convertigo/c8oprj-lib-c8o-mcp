  comment: Compute normalized status and timing metadata
  expression: |
    'latencyMs = java.lang.System.currentTimeMillis() - startedAt;
    var parsedStatus = 0;
    var statusText = httpStatusText == null ? "" : String(httpStatusText).trim();
    if (statusText.length) {
      try {
        parsedStatus = parseInt(statusText, 10);
      } catch (_ignoredStatus) {}
    }
    if (isNaN(parsedStatus)) {
      parsedStatus = 0;
    }
    httpStatusCode = parsedStatus;
    resultStatus = parsedStatus >= 200 && parsedStatus < 300 ? "ok" : "error";
    retryable = parsedStatus == 408 || parsedStatus == 429 || parsedStatus >= 500;
    resultMessage = (resultStatus == "ok"
      ? "Knowledge base answer received."
      : "Knowledge base request failed.") + " Typical response time: 30-60 seconds.";
    
    var refs = [];
    var refsSource = referencesNodes;
    if (refsSource != null) {
      try {
        if (typeof refsSource.item === "function" && typeof refsSource.getLength === "function") {
          for (var i = 0; i < refsSource.getLength(); i++) {
            var refNode = refsSource.item(i);
            var refText = "";
            if (refNode != null) {
              refText = typeof refNode.getTextContent === "function" ? String(refNode.getTextContent()) : String(refNode);
            }
            refText = refText == null ? "" : String(refText).trim();
            if (refText.length) {
              refs.push(refText);
            }
          }
        } else if (typeof refsSource.length === "number") {
          for (var j = 0; j < refsSource.length; j++) {
            var refNodeAlt = refsSource[j];
            var refTextAlt = "";
            if (refNodeAlt != null) {
              refTextAlt = typeof refNodeAlt.getTextContent === "function" ? String(refNodeAlt.getTextContent()) : String(refNodeAlt);
            }
            refTextAlt = refTextAlt == null ? "" : String(refTextAlt).trim();
            if (refTextAlt.length) {
              refs.push(refTextAlt);
            }
          }
        } else {
          var singleRef = String(refsSource).trim();
          if (singleRef.length) {
            refs.push(singleRef);
          }
        }
      } catch (_ignoredRefs) {}
    }
    referencesList = refs;'
