accessibility: Private
comment: |
  Setup local Codex onboarding for this MCP project
  Generates or updates the local Convertigo skills and config.toml, including an optional MCP bearer token and the X-Convertigo-No-Log header (see mcpNoLog).
↓IncludeHelpers [steps.SimpleStep-1773653288527]: 
  comment: Load the local Codex setup helper.
  expression: include("js/setup_codex.js");
↓result [steps.JsonToXmlStep-1773653288550]: 
  jsonObject: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: JS
        - →→: setupCodexResult
  key: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: PLAIN
        - →→: result
↓codexHome [variables.RequestableVariable-1773653288576]: 
  comment: Optional Codex home directory. Defaults to ~/.codex on the local Studio machine.
  description: Optional Codex home directory. Defaults to ~/.codex on the local Studio machine.
↓mcpUrl [variables.RequestableVariable-1773653288593]: 
  comment: Optional MCP URL override. Defaults to the locally resolved Convertigo MCP endpoint.
  description: Optional MCP URL override. Defaults to the locally resolved Convertigo MCP endpoint.
↓dryRun [variables.RequestableVariable-1773653288599]: 
  comment: Set true to preview the generated skill and config patch without writing files.
  description: Set true to preview the generated skill and config patch without writing files.
  value: false
↓mcpToken [variables.RequestableVariable-1788367781676]: 
  comment: Optional MCP bearer token written as an Authorization header. Keep this value secret.
  description: Optional MCP bearer token written as an Authorization header. Keep this value secret.
  value: 
    - ↑traceable: false
  visibility: 1
↓mcpNoLog [variables.RequestableVariable-1792051200101]: 
  comment: 'Optional. true writes the X-Convertigo-No-Log: true header on the convertigo MCP server, so Convertigo 8.4.6+ writes no engine log for the MCP requests of this client; false removes it. Empty: global symbol agentbridge.mcp.nolog, else true. An entry owned by lib_ConvertigoAgentBridge (url with from_bridge=true) keeps its header.'
  description: 'Optional. true writes the X-Convertigo-No-Log: true header on the convertigo MCP server, so Convertigo 8.4.6+ writes no engine log for the MCP requests of this client; false removes it. Empty: global symbol agentbridge.mcp.nolog, else true. An entry owned by lib_ConvertigoAgentBridge (url with from_bridge=true) keeps its header.'