  comment: Resolve requested resource
  expression: |
    'var uriText = C8O.util.toTrimmedString(uri || "");
    if (!uriText.length) {
      throw new Error("Resource URI is required");
    }
    var entry = c8oFindResourceByUri(uriText);
    if (!entry) {
      throw new Error("Resource not found: " + uriText);
    }
    resourceMeta = entry;
    resourceText = c8oReadResourceFile(entry);'
