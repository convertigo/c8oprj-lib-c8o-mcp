      }
      var tree = buildNode(projectInstance, 0, depth);
      return ok({ content: [{ type: "json", json: tree }] });
    }
    function adminTools() {
      return [
        makeTool("admin.get-engine-version", "Get engine version", "Returns the running Convertigo engine version.", null, "admin"),
