      var children = [];
      if (dbo instanceof Packages.com.twinsoft.convertigo.beans.core.Project) {
        var seqIt = dbo.getSequencesList().iterator();
        while (seqIt.hasNext()) {
          children.push(buildNode(seqIt.next(), level + 1, maxDepth));
        }
        var connectorIt = dbo.getConnectorsList().iterator();
        while (connectorIt.hasNext()) {
          children.push(buildNode(connectorIt.next(), level + 1, maxDepth));
        }
        var mapper = dbo.getUrlMapper();
        if (mapper != null) {
          children.push(buildNode(mapper, level + 1, maxDepth));
        }
      } else if (dbo instanceof Packages.com.twinsoft.convertigo.beans.core.UrlMapper) {
        var mappingIt = dbo.getMappingList().iterator();
        while (mappingIt.hasNext()) {
          children.push(buildNode(mappingIt.next(), level + 1, maxDepth));
        }
      } else if (dbo instanceof Packages.com.twinsoft.convertigo.beans.rest.PathMapping) {
        var opIt = dbo.getOperationList().iterator();
        while (opIt.hasNext()) {
          children.push(buildNode(opIt.next(), level + 1, maxDepth));
        }
      } else if (dbo instanceof Packages.com.twinsoft.convertigo.beans.core.Sequence) {
