        numeric = 400;
      }
      return { ok: false, code: code, message: message, data: data, status: numeric };
    }
    function makeTool(name, title, description, inputSchema, category) {
      var tool = {
        name: name,
        title: title,
        description: description,
        inputSchema: inputSchema || { type: "object", properties: {}, additionalProperties: false }
      };
      if (category) {
        tool.metadata = { category: category };
      }
      return tool;
    }
    function listProjects() {
      var names = [];
      try {
        var projectsDir = new java.io.File(Engine.PROJECTS_PATH);
        if (projectsDir.exists()) {
          var children = projectsDir.listFiles();
          if (children != null) {
            for (var i = 0; i < children.length; i++) {
              var child = children[i];
              if (child.isDirectory()) {
                var marker = new java.io.File(child, "c8oProject.yaml");
                if (marker.exists()) {
                  names.push(String(child.getName()));
                }
              }
            }
          }
        }
      } catch (ignore) {}
      names.sort();
      return names;
    }
    function collectEngineMetrics() {
      var runtime = java.lang.Runtime.getRuntime();
      return {
        memoryBytes: {
          used: runtime.totalMemory() - runtime.freeMemory(),
          free: runtime.freeMemory(),
          total: runtime.totalMemory(),
          max: runtime.maxMemory()
        },
        uptimeMs: java.lang.System.currentTimeMillis() - Engine.startStopDate,
        projectCount: listProjects().length
      };
    }
    function normalizeDepth(value) {
      if (value === undefined || value === null || value === "") {
        return 1;
      }
      var depth = Number(value);
      if (isNaN(depth) || depth < 0) {
        depth = 1;
      }
      if (depth > 3) {
        depth = 3;
      }
      return Math.floor(depth);
    }
    function buildNode(dbo, level, maxDepth) {
      var node = {
        name: String(dbo.getName()),
        type: String(dbo.getClass().getSimpleName())
