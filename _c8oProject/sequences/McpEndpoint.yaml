        return ko(-32602, "Missing project name", null, 400);
      }
      var depth = normalizeDepth(args.depth);
      var projectInstance = null;
      try {
        projectInstance = Engine.theApp.databaseObjectsManager.getOriginalProjectByName(projectName);
