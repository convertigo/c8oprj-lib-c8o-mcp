      expression: |
        'var paramsJson = "{}";
        try { paramsJson = JSON.stringify(paramsObject); } catch (_p) { paramsJson = "{}"; }
        if (methodName === "initialize") {
            callSequence = "McpInitialize";
            callVariables = { initProtocol: SUPPORTED_PROTOCOL };
        } else if (methodName === "notifications/initialized") {
          responseStatus = "202";
          responseHasBody = false;
        } else if (methodName === "ping") {
          callSequence = "McpPing";
        } else if (methodName === "tools/list") {
          callSequence = "McpToolsList";
          callVariables = { paramsJson: paramsJson };
        } else if (methodName === "tools/call") {
          var toolName = paramsObject && typeof paramsObject.name === "string" ? paramsObject.name : "";
          var toolArgs = paramsObject && typeof paramsObject.arguments === "object" && !Array.isArray(paramsObject.arguments) ? paramsObject.arguments : {};
          function toPascalCase(segment) {
            if (!segment) { return ""; }
            var parts = String(segment).split(/[^A-Za-z0-9]+/);
            var out = [];
            for (var i = 0; i < parts.length; i++) {
              var token = parts[i];
              if (!token) { continue; }
              out.push(token.charAt(0).toUpperCase() + token.substring(1));
            }
            return out.length > 0 ? out.join("") : String(segment);
          }
          if (!toolName || toolName.length === 0) {
            callSequence = "McpErrorResponse";
            responseStatus = "400";
            callVariables = { status: "400", code: "-32602", message: "Missing tool name", requestIdJson: requestIdJson };
          } else {
            var nameParts = toolName.split(/\./);
            if (nameParts.length < 2) {
              callSequence = "McpErrorResponse";
              responseStatus = "400";
              callVariables = { status: "400", code: "-32602", message: "Invalid tool identifier", dataJson: JSON.stringify({ name: toolName }), requestIdJson: requestIdJson };
            } else {
              var category = toPascalCase(nameParts[0]);
              var actionSegments = [];
              for (var s = 1; s < nameParts.length; s++) { actionSegments.push(toPascalCase(nameParts[s])); }
              var actionName = actionSegments.join("_");
              var targetSequence = "Tools_" + category + (actionName.length > 0 ? "_" + actionName : "");
              var targetProject = Engine.theApp.databaseObjectsManager.getOriginalProjectByName("ConvertigoMCP");
              var requestable = targetProject ? targetProject.getSequenceByName(targetSequence) : null;
              if (requestable == null) {
                callSequence = "McpErrorResponse";
                responseStatus = "404";
                callVariables = { status: "404", code: "-32601", message: "Unknown tool", dataJson: JSON.stringify({ name: toolName, sequence: targetSequence }), requestIdJson: requestIdJson };
              } else {
                callSequence = targetSequence;
                responseStatus = "200";
                callVariables = toolArgs || {};
              }
            }
          }
        } else if (methodName === "logging/setLevel") {
          callSequence = "McpLoggingSetLevel";
          responseStatus = "200";
          callVariables = { requestIdJson: requestIdJson, paramsJson: paramsJson };
        } else {
          callSequence = "McpErrorResponse";
          responseStatus = "404";
          callVariables = { status: "404", code: "-32601", message: "Method not implemented", dataJson: JSON.stringify({ method: methodName }), requestIdJson: requestIdJson };
        }'
