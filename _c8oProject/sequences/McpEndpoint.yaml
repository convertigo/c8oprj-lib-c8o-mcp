    mcp_error = false;
    mcp_error_status = "";
    mcp_error_code = null;
    mcp_error_message = "";
    mcp_error_data_json = "";
    mcp_method = null;
    mcp_request_id = undefined;
    mcp_request_id_json = "";
    mcp_params_json = "{}";
    mcp_header_version = "";
    if (context.httpServletRequest != null) {
      var headerValue = context.httpServletRequest.getHeader("MCP-Protocol-Version");
      if (headerValue != null) { mcp_header_version = String(headerValue); }
    }
    function recordError(status, code, message, data) {
      mcp_error = true;
      mcp_error_status = String(status);
      mcp_error_code = Number(code);
      mcp_error_message = String(message);
      if (data !== undefined && data !== null) {
        try { mcp_error_data_json = JSON.stringify(data); } catch (e) { mcp_error_data_json = JSON.stringify({ raw: String(data) }); }
      } else {
        mcp_error_data_json = "";
      }
    }
    try {
      if (request == null || String(request).trim().length === 0) {
        recordError(400, -32700, "Empty request body");
      } else {
        var requestObject = JSON.parse(String(request));
        if (!requestObject || typeof requestObject !== "object" || Array.isArray(requestObject)) {
          recordError(400, -32600, "Invalid request payload");
        } else {
          if (requestObject.hasOwnProperty("id")) {
            mcp_request_id = requestObject.id;
            try { mcp_request_id_json = JSON.stringify(requestObject.id); } catch (idError) { mcp_request_id_json = JSON.stringify(String(requestObject.id)); }
          } else {
            mcp_request_id = undefined;
            mcp_request_id_json = "";
          }
          if (requestObject.jsonrpc !== undefined && requestObject.jsonrpc !== JSON_RPC_VERSION) {
            recordError(400, -32600, "Unsupported JSON-RPC version", { expected: JSON_RPC_VERSION, received: requestObject.jsonrpc });
          } else if (typeof requestObject.method !== "string" || requestObject.method.length === 0) {
            recordError(400, -32600, "Missing method name");
          } else {
            mcp_method = requestObject.method;
            var params = requestObject.params;
            if (params === undefined || params === null) { params = {}; }
            try { mcp_params_json = JSON.stringify(params); } catch (paramsError) { mcp_params_json = "{}"; }
          }
        }
      }
    } catch (parseError) {
      recordError(400, -32700, "Invalid JSON", { message: String(parseError) });
    }
    '
