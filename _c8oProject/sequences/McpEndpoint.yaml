        return ko(-32602, "Tool arguments must be an object", { name: name }, 400);
      }
      try {
        switch (name) {
          case "admin.get-engine-version":
            return ok(toolCallResult([{ type: "text", text: "Convertigo engine version: " + String(ProductVersion.productVersion) }]));
          case "admin.get-engine-metrics":
            return ok(toolCallResult([{ type: "json", json: collectEngineMetrics() }]));
          case "project.describe-tree":
            return describeProjectTree(args);
          case "invoke.list-projects":
            return ok(toolCallResult([{ type: "json", json: { projects: listProjects() } }]));
          default:
            return ko(-32601, "Unknown tool", { name: name }, 404);
