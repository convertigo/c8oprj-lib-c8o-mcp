      switch (category) {
        case "admin":
          tools = adminTools();
          break;
        case "project":
          tools = projectTools();
          break;
        case "invoke":
          tools = invokeTools();
          break;
        default:
          tools = [];
          break;
      }
      var payload = { tools: tools };
      if (index + 1 < TOOL_CATEGORIES.length) {
        payload.nextCursor = TOOL_CATEGORIES[index + 1];
      }
      return ok(payload);
