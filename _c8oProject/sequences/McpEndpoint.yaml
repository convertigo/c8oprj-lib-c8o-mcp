    'var JSON_RPC_VERSION = "2.0";
    var MCP_PROTOCOL_VERSION = "2025-06-18";
    var rawRequest = request == null ? "" : String(request);
    var headerVersion = "";
    if (context.httpServletRequest != null) {
      var header = context.httpServletRequest.getHeader("MCP-Protocol-Version");
      if (header != null) { headerVersion = String(header); }
    }
    var status = "200";
    var requestId = undefined;
    var methodName = null;
    var params = {};
    var error = null;
    function makeError(httpStatus, code, message, data) {
      status = String(httpStatus == null ? 400 : httpStatus);
      error = { code: Number(code), message: String(message) };
      if (data !== undefined && data !== null) { error.data = data; }
    }
    if (!rawRequest || rawRequest.trim().length === 0) {
      makeError(400, -32700, "Empty request body");
    } else {
      try {
        var parsed = JSON.parse(rawRequest);
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
          makeError(400, -32600, "Invalid request payload");
        } else {
          if (parsed.hasOwnProperty("id")) { requestId = parsed.id; }
          if (parsed.jsonrpc !== undefined && parsed.jsonrpc !== JSON_RPC_VERSION) {
            makeError(400, -32600, "Unsupported JSON-RPC version", { expected: JSON_RPC_VERSION, received: parsed.jsonrpc });
          } else if (typeof parsed.method !== "string" || parsed.method.length === 0) {
            makeError(400, -32600, "Missing method name");
          } else {
            methodName = parsed.method;
            params = parsed.params !== undefined && parsed.params !== null ? parsed.params : {};
          }
        }
      } catch (e) {
        makeError(400, -32700, "Invalid JSON", { message: String(e) });
      }
    }
    if (!error && headerVersion && headerVersion !== MCP_PROTOCOL_VERSION) {
      makeError(400, -32600, "Unsupported MCP protocol version", { supported: MCP_PROTOCOL_VERSION, received: headerVersion });
    }
    if (!error) {
      if (methodName === "initialize") {
        var requestedVersion = params && params.protocolVersion !== undefined ? String(params.protocolVersion) : MCP_PROTOCOL_VERSION;
        if (requestedVersion !== MCP_PROTOCOL_VERSION) {
          makeError(400, -32602, "Unsupported protocolVersion", { supported: MCP_PROTOCOL_VERSION, received: requestedVersion });
        }
      } else if (methodName === "ping") {
        // keep status 200
      } else if (methodName === null) {
        makeError(400, -32600, "Missing method name");
      } else {
        makeError(404, -32601, "Method not found", { method: methodName });
      }
    }
    var idValue = (requestId === undefined) ? null : requestId;
    var response;
    if (!error && methodName === "initialize") {
      response = {
        jsonrpc: JSON_RPC_VERSION,
        id: idValue,
        result: {
          protocolVersion: MCP_PROTOCOL_VERSION,
          capabilities: {
            tools: { listChanged: false },
            resources: { listChanged: false },
            prompts: { listChanged: false },
            logging: {}
          },
          serverInfo: { name: "convertigo-mcp", title: "Convertigo MCP Server", version: "0.1.0" },
          instructions: "Use Convertigo MCP tools to inspect and manage the engine."
        }
      };
    } else if (!error && methodName === "ping") {
      response = { jsonrpc: JSON_RPC_VERSION, id: idValue, result: { ok: true } };
    } else {
      if (!error) {
        error = { code: -32601, message: "Method not found", data: { method: methodName } };
        status = "404";
      }
      response = { jsonrpc: JSON_RPC_VERSION, id: idValue, error: error };
    }
    mcp_status = status;
    mcp_protocol_version = MCP_PROTOCOL_VERSION;
    mcp_response_object = response;
    mcp_method_name = methodName;
    '
