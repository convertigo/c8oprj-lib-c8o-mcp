accessibility: Private
comment: |
  Build the NGX app for production
  Runs the production build of the NGX application of a project, as the Build button of the Studio's Build panel does (npm run build, written to DisplayObjects/mobile, which a deployed project serves; deployed without it, the app shows "Not built"). Waits up to waitSec (40 at most); a longer build answers status running with its buildId: call again with that buildId to wait. Answers success with the output folder, or failed with the compile errors. Run it before a deployment or an export for a server, after the dev build is green. On an engine without the production build entry point it answers unsupported: ask the user to click Build in the Studio before deploying.
responseTimeout: 60
