↓BuildResponse [steps.SimpleStep-1761219993110]: 
  comment: Prepare JSON-RPC error response
  expression: |
    'var JSON_RPC_VERSION = "2.0";
    var MCP_PROTOCOL_VERSION = "2025-06-18";
    var statusValue = status != null && String(status).length ? String(status) : "400";
    var codeValue = Number(code != null ? code : -32603);
    if (isNaN(codeValue)) { codeValue = -32603; }
    var messageValue = (message != null && String(message).length) ? String(message) : "Internal error";
    var dataValue = null;
    if (dataJson != null && String(dataJson).length > 0) {
      try { dataValue = JSON.parse(String(dataJson)); } catch (e) { dataValue = { raw: String(dataJson) }; }
    }
    var requestIdValue = null;
    if (requestIdJson != null && String(requestIdJson).length > 0) {
      try { requestIdValue = JSON.parse(String(requestIdJson)); } catch (e) { requestIdValue = requestIdJson; }
    } else {
      requestIdValue = null;
    }
    mcp_response_status = String(statusValue);
    mcp_protocol_version = MCP_PROTOCOL_VERSION;
    mcp_has_body = true;
    mcp_response_payload = { jsonrpc: JSON_RPC_VERSION, id: requestIdValue, error: { code: codeValue, message: messageValue } };
    if (dataValue !== null && dataValue !== undefined) { mcp_response_payload.error.data = dataValue; }'
