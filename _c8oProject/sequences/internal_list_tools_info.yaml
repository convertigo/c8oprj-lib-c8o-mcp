  expression: |
    'function splitComment(text) {
      if (!text) { return { title: "", description: "" }; }
      var normalized = String(text).replace(/\r\n?/g, "\n").trim();
      if (normalized.length === 0) { return { title: "", description: "" }; }
      var lines = normalized.split("\n");
      var title = "";
      var descriptionParts = [];
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!title && line.length) {
          title = line;
        } else if (line.length) {
          descriptionParts.push(line);
        }
      }
      return { title: title, description: descriptionParts.join("\n") };
    }
    
    function sanitizeSlug(value) {
      if (!value) { return ""; }
      var slug = String(value).toLowerCase().replace(/[^a-z0-9_-]+/g, "-");
      slug = slug.replace(/-{2,}/g, "-").replace(/^-+|-+$/g, "");
      return slug;
    }
    
    function humanize(value) {
      if (!value) { return ""; }
      var text = String(value).replace(/[-_]+/g, " " ).trim();
      if (!text.length) { return ""; }
      return text.replace(/\w\S*/g, function(word) {
        return word.charAt(0).toUpperCase() + word.substring(1).toLowerCase();
      });
    }
    
    var requestable = context.project.getSequenceByName(sequence);
    if (!requestable) { throw new Error("Sequence not found: " + sequence); }
    var lowerName = String(sequence).toLowerCase();
    if (!lowerName.startsWith("tools_")) { throw new Error("Invalid tool sequence name: " + sequence); }
    var tokens = lowerName.split("_");
    var rawCategory = tokens.length > 1 ? tokens[1] : "";
    var categorySlug = sanitizeSlug(rawCategory) || "general";
    var rawSegments = tokens.slice(2);
    var combinedRaw = rawSegments.join("-");
    var mainSlug = sanitizeSlug(combinedRaw) || "tool";
    var toolName = categorySlug.length ? categorySlug + "-" + mainSlug : mainSlug;
    var meta = splitComment(requestable.getComment());
    var fallbackTitle = humanize(mainSlug) || humanize(sequence.replace(/^tools_/, "")) || "Tool";
    var toolTitle = meta.title && meta.title.length ? meta.title : fallbackTitle;
    var toolDescription = meta.description && meta.description.length ? meta.description : toolTitle;
    category = categorySlug;
    tool_slug = mainSlug;
    tool_name = toolName;
    tool_title = toolTitle;
    tool_description = toolDescription;'
