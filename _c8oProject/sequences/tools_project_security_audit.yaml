accessibility: Private
comment: |
  Audit the security of a Convertigo project
  Statically audits one project (exposure, authentication, secrets, injection, dangerous steps, transport, session, references, NGX frontend and engine settings) and returns sourced findings with a deterministic 0-100 score and an A-F grade. Read-only; secret values are never returned, only their literal/symbol/empty status.
