accessibility: Private
comment: |
  Audit the security of a Convertigo project
  Statically audits one project (exposure, authentication, secrets, injection, dangerous steps, transport, session, references, NGX frontend and engine settings) and returns sourced findings with a deterministic 0-100 score and an A-F grade, and the raw score and grade before the accepted risks (suppress). Read-only; secret values are never returned, only their literal/symbol/empty status.
↓IncludeHelpers [steps.SimpleStep-1790616258202]: 
  comment: Load the audit rules and the project collector.
  expression: |
    include("js/security_audit_rules.js");
    include("js/security_audit_collect.js");
↓Init [steps.SimpleStep-1790616258204]: 
  comment: Collect the project model, evaluate the rules and score them.
  expression: include("js/tools_project_security_audit.js");
