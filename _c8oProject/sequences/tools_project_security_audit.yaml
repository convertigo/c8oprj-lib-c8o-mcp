↓project [variables.RequestableVariable-1790616258242]: 
  comment: Project technical name to audit.
  description: Project technical name to audit.
↓includeEngine [variables.RequestableVariable-1790616258244]: 
  comment: Set false to skip engine-wide checks (CORS policy, XSRF, crypto passphrase, admin password).
  description: Set false to skip engine-wide checks (CORS policy, XSRF, crypto passphrase, admin password).
  value: true
↓includeFrontend [variables.RequestableVariable-1790616258246]: 
  comment: Set false to skip the NGX frontend source scan.
  description: Set false to skip the NGX frontend source scan.
  value: true
↓minSeverity [variables.RequestableVariable-1790616258248]: 
  comment: 'Lowest severity listed in findings: info, low, medium, high or critical. The score always counts every finding.'
  description: 'Lowest severity listed in findings: info, low, medium, high or critical. The score always counts every finding.'
  value: low
↓limit [variables.RequestableVariable-1790616258250]: 
  comment: Maximum findings listed. 1 to 1000; default 200. Summary counts stay complete.
  description: Maximum findings listed. 1 to 1000; default 200. Summary counts stay complete.
  value: 200
↓suppress [variables.RequestableVariable-1790616258252]: 
  comment: Accepted risks as a JSON array of {ruleId, qname?, reason}, the reason required. Matching findings stay listed with suppressed=true and no longer lower score and grade; rawScore and rawGrade still count them. An exposure finding on a requestable anyone can call that writes data is not suppressed (suppressRefused says why).
