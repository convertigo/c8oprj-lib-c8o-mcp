accessibility: Private
comment: |
  Save a workflow draft
  Saves the draft of a workflow at the revision the agent read: the whole definition, or patch, a JSON merge patch of the draft (null removes a key, objects merge, lists replace). A draft saved by someone else meanwhile is refused (conflict): read it again. Answers the new draftRevision and the validation of the engine (errors with their path); saving never publishes. Designers only. Acts as the user of the MCP token, with the roles the workflow engine gives that user. Needs lib_WorkflowEngine.
↓Run [steps.SimpleStep-1794200000019]: 
  expression: |
    'include("js/mcp_auth.js");
    include("js/workflow_tools.js");
    result = C8O.workflowTools.draftPut({
      workflowKey: typeof workflowKey === "undefined" ? null : workflowKey,
      expectedRevision: typeof expectedRevision === "undefined" ? null : expectedRevision,
      definition: typeof definition === "undefined" ? null : definition,
      patch: typeof patch === "undefined" ? null : patch,
      notes: typeof notes === "undefined" ? null : notes
    });'
↓result [steps.JsonToXmlStep-1794200000020]: 
  jsonObject: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: JS
        - →→: result
  key: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: PLAIN
        - →→: result
↓workflowKey [variables.RequestableVariable-1794200000021]: 
