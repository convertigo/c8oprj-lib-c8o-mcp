  description: 'The whole definition (JSON object), replacing the draft.'
↓patch [variables.RequestableVariable-1794200000024]: 
  comment: 'JSON merge patch applied to the draft, instead of definition.'
  description: 'JSON merge patch applied to the draft, instead of definition.'
↓notes [variables.RequestableVariable-1794200000025]: 
