accessibility: Private
comment: |
  Read the brief of an existing project before changing it
  One call instead of exploring the tree: the pages with their route segment, the sequences they call, the pages they open and their main components (lists with their columns and fields, KPI cards, forms, buttons); the sequences with who can call them; the tables and their fields; the sign-in flow, the roles and the page guard; the references used; the style index (each CSS class the pages use and where it is defined: an app style such as AppLayout, the theme or a page style, and the pages without a style of their own); and the project notes (_private/docs/PROGRESS.md, never served; read from docs/generated/PROGRESS.md in a project not moved yet) written by earlier turns, with servedDocs: text files a deployed server serves to anyone. With page: every object of that page, one line each with its QName suffix, classes, texts, bindings, events and actions, and the CSS rules of the classes it uses; classes adds the rules of other classes. Read-only, computed from the loaded project at each call.
