accessibility: Private
comment: |
  Return a minimal JSON skeleton for one palette entry
  Resolves a palette class against an existing parent QName, prefers a canonical `yamlTemplate` from the palette registry when available, falls back to the live palette full XML export otherwise, and returns a minimal JSON subtree wrapper ready to adapt. Use this when you need the exact JSON shape for `c8oProject.json` / `_c8oProjectJson` without mining other projects for examples.
