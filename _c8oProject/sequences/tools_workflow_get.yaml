accessibility: Private
comment: |
  Read a workflow definition
  Reads the draft to edit (default, designers): its definition, draftRevision (pass it as expectedRevision to workflow-draft-put and workflow-publish), validation, published versions and requests per state. version published or a number reads a published, immutable version instead. The definition syntax is in convertigo://resources/convertigo-workflow. Acts as the user of the MCP token, with the roles the workflow engine gives that user. Needs lib_WorkflowEngine.
