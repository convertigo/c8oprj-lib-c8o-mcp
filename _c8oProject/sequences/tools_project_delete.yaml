accessibility: Private
comment: |
  Delete a project from the workspace
  Removes one project by technical name and deletes its files. Benchmark cleanup should use this instead of databaseobject-delete on the project root.
↓IncludeHelpers [steps.SimpleStep-1773102101001]: 
  comment: Load shared database helpers
  expression: include("js/databaseobject.js");
↓Init [steps.SimpleStep-1773102101002]: 
  comment: Resolve project and perform deletion
  expression: |
    'var Engine = Packages.com.twinsoft.convertigo.engine.Engine;
    var File = Packages.java.io.File;
    
    var providedName = C8O.util.toTrimmedString(project);
    if (!providedName.length && context && context.project) {
      providedName = String(context.project.getName());
    }
    
    var deleteCarInput = (typeof deleteCar !== "undefined") ? deleteCar : true;
    var deleteCarFlag = C8O.util.toBoolean(deleteCarInput, true) === true;
    var errorEntries = [];
    var foundBeforeDelete = false;
    var deletedFlag = false;
    var statusText = "missing";
    var messageText = "";
    
    if (!providedName.length) {
      messageText = "Project name is required";
      errorEntries.push({ name: "__delete__", message: messageText });
    } else {
      try {
        foundBeforeDelete = Engine.theApp.databaseObjectsManager.existsProject(providedName);
      } catch (_ignoredExistsBefore) {}
      if (!foundBeforeDelete) {
        messageText = "Project not found: " + providedName;
      } else {
        try {
          if (deleteCarFlag) {
            Engine.theApp.databaseObjectsManager.deleteProjectAndCar(providedName);
          } else {
            Engine.theApp.databaseObjectsManager.deleteProject(providedName, false, false);
          }
          try {
            var ConvertigoPlugin = Packages.com.twinsoft.convertigo.eclipse.ConvertigoPlugin;
            var plugin = ConvertigoPlugin != null && ConvertigoPlugin.getDefault ? ConvertigoPlugin.getDefault() : null;
            if (plugin != null) {
              plugin.deleteProjectPluginResource(true, providedName);
            }
          } catch (_ignoredStudioCleanup) {}
          var stillExists = false;
          try {
            stillExists = Engine.theApp.databaseObjectsManager.existsProject(providedName);
          } catch (_ignoredExistsAfter) {}
          deletedFlag = !stillExists;
          statusText = deletedFlag ? "deleted" : "failed";
          if (!deletedFlag) {
            messageText = "Project still exists after deletion attempt";
            errorEntries.push({ name: "delete", message: messageText });
          }
        } catch (deleteError) {
          statusText = "failed";
          messageText = String(deleteError);
          errorEntries.push({ name: "delete", message: messageText });
        }
      }
    }
    
    projectDeleteProvided = providedName;
    projectDeleteFound = foundBeforeDelete;
    projectDeleteDeleted = deletedFlag;
    projectDeleteDeleteCar = deleteCarFlag;
    projectDeleteStatus = statusText;
    projectDeleteMessage = messageText;
    projectDeleteTimestamp = java.lang.System.currentTimeMillis();
    projectDeleteErrors = errorEntries;
    '
