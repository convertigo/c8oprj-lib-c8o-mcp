↓InitContext [steps.SimpleStep-1762339712893]: 
  comment: Resolve parent/sibling and validate input
  expression: |
    'var ProjectClass = Packages.com.twinsoft.convertigo.beans.core.Project;
    
    var relatedDbo = C8O.dbo.resolve(related, { messagePrefix: "related" });
    var modeText = C8O.util.toTrimmedString(mode).toLowerCase();
    if (!modeText.length) {
      modeText = "inside";
    }
    var allowedModes = { "inside": true, "before": true, "after": true };
    if (!allowedModes[modeText]) {
      modeText = "inside";
    }
    var classNameText = C8O.util.toTrimmedString(className);
    if (!classNameText.length) {
      throw new Error("className is required");
    }
    var nameText = C8O.util.toTrimmedString(name);
    var propertiesText = C8O.util.toTrimmedString(properties);
    
    var autoSaveInput = (typeof autoSave !== "undefined") ? autoSave : null;
    if ((autoSaveInput === null || autoSaveInput === undefined) && typeof commit !== "undefined") {
      autoSaveInput = commit;
    }
    var autoSaveFlag = C8O.util.parseAutoSaveFlag(autoSaveInput, true);
    
    var parentDbo = null;
    var siblingDbo = null;
    if (modeText === "inside") {
      parentDbo = relatedDbo;
    } else {
      siblingDbo = relatedDbo;
      parentDbo = siblingDbo.getParent();
    }
    if (parentDbo == null) {
      throw new Error("Unable to resolve parent for insert mode " + modeText);
    }
    
    var projectRef = null;
    try {
      projectRef = parentDbo.getProject();
    } catch (ignoredProject) {}
    if (projectRef == null && parentDbo instanceof ProjectClass) {
      projectRef = parentDbo;
    }
    
    var afterValue = null;
    if (modeText === "after" && siblingDbo != null) {
      afterValue = java.lang.Long.valueOf(siblingDbo.priority);
    } else if (modeText === "before" && siblingDbo != null) {
      var previous = null;
      try {
        var siblings = parentDbo.getDatabaseObjectChildren();
        for (var i = 0; i < siblings.size(); i++) {
          var child = siblings.get(i);
          if (child.getParent() !== parentDbo) {
            continue;
          }
          if (child == siblingDbo) {
            break;
          }
          previous = child;
        }
      } catch (ignoredList) {}
      if (previous != null) {
        afterValue = java.lang.Long.valueOf(previous.priority);
      } else {
        afterValue = java.lang.Long.valueOf(0);
      }
    }
    
    creationMode = modeText;
    creationRelated = String(relatedDbo.getFullQName ? relatedDbo.getFullQName() : relatedDbo.getQName());
    creationClassName = classNameText;
    creationRequestedName = nameText;
    creationProperties = propertiesText;
    creationPropertiesProvided = propertiesText.length > 0;
    creationParsedUpdates = {};
    creationPropertiesErrors = [];
    if (creationPropertiesProvided) {
      creationParsedUpdates = C8O.dbo.parsePropertyUpdates(creationProperties, creationPropertiesErrors);
      if (!creationParsedUpdates || typeof creationParsedUpdates !== "object") {
        creationParsedUpdates = {};
      }
    }
    creationAutoSave = autoSaveFlag;
    creationParent = parentDbo;
    creationSibling = siblingDbo;
    creationAfter = afterValue;
    creationAfterNumber = afterValue != null ? afterValue.longValue() : null;
    creationProject = projectRef;
    creationProjectName = projectRef != null ? String(projectRef.getName()) : "";
    creationSiblingQName = siblingDbo != null ? String(siblingDbo.getFullQName()) : "";
    creationTimestamp = java.lang.System.currentTimeMillis();
    
    createdObject = null;
    createdQName = "";
    createdParentQName = parentDbo != null ? String(parentDbo.getFullQName ? parentDbo.getFullQName() : parentDbo.getQName()) : "";
    createdName = "";
    createdClassName = "";
    creationSaved = false;
    creationSaveMessage = "";
    creationAutoSaveApplied = autoSaveFlag;
    creationPropertiesApplied = [];
    creationPropertiesSkipped = [];
    '
↓CreateObject [steps.SimpleStep-1762339712895]: 
  comment: Instantiate and attach new database object
  expression: |
    'var Engine = Packages.com.twinsoft.convertigo.engine.Engine;
    var parent = creationParent;
    if (parent == null) {
      throw new Error("Parent database object is not defined");
    }
    if (creationClassName) {
      try {
        creationClassName = C8O.util && C8O.util.toFqcn ? C8O.util.toFqcn(creationClassName) : creationClassName;
      } catch (_ignoreFqcn) {}
    }
    var parsedUpdates = creationParsedUpdates && typeof creationParsedUpdates === "object" ? creationParsedUpdates : {};
    var newDbo = C8O.dbo.instantiateForCreate(creationClassName, parent, parsedUpdates);
    if (newDbo == null) {
      throw new Error("Unable to instantiate class " + creationClassName);
    }
    newDbo.bNew = true;
    newDbo.hasChanged = true;
    if (creationRequestedName && creationRequestedName.length > 0) {
      try {
        newDbo.setName(creationRequestedName);
      } catch (nameError) {
        throw new Error("Unable to set name ''" + creationRequestedName + "'': " + nameError);
      }
    }
    var afterValue = creationAfter;
    var added = false;
    if (afterValue != null) {
      try {
        parent.add(newDbo, afterValue);
        added = true;
      } catch (eAddDirect) {
        try {
          var method = parent.getClass().getMethod("add", Packages.com.twinsoft.convertigo.beans.core.DatabaseObject, java.lang.Long.class);
          method.invoke(parent, newDbo, afterValue);
          added = true;
        } catch (eReflect) {
          // fallback later
        }
      }
    }
    if (!added) {
      parent.add(newDbo);
    }
    var projectRef = creationProject;
    if (projectRef == null) {
      try { projectRef = newDbo.getProject(); } catch (ignoredProject) {}
    }
    createdObject = newDbo;
    createdQName = String(newDbo.getFullQName());
    createdName = String(newDbo.getName());
    createdClassName = C8O.util.fromFqcn ? C8O.util.fromFqcn(newDbo.getClass().getName()) : newDbo.getClass().getName();
    createdParentQName = String(parent.getQName());
    createdProject = projectRef;
    '
↓Finalize [steps.SimpleStep-1762339712897]: 
  comment: Commit changes and prepare summary
  expression: |
    'var parsedUpdates = creationParsedUpdates && typeof creationParsedUpdates === "object" ? creationParsedUpdates : {};
    var mutation = C8O.dbo.applyUpdatesAndPersist({
      dbo: createdObject,
      project: createdProject,
      updates: parsedUpdates,
      errors: creationPropertiesErrors,
      autoSave: creationAutoSave,
      persistIfNoUpdate: true
    });
    
    creationPropertiesApplied = mutation.applied || [];
    creationPropertiesSkipped = mutation.skipped || [];
    creationMobileBuilderRefresh = mutation.mobileBuilderRefresh || { requested: false, studioMode: false, mobileObject: false, triggered: false, message: "" };
    creationSaved = mutation.saved === true;
    creationSaveMessage = mutation.saveResult ? (mutation.saveResult.message || "") : "";
    creationAutoSaveApplied = creationAutoSave;
    createdProject = mutation.project || createdProject;
    '
