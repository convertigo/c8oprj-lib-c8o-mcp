  expression: |
    'var ProjectClass = Packages.com.twinsoft.convertigo.beans.core.Project;
    
    var relatedDbo = C8O.dbo.resolve(related, { messagePrefix: "related" });
    var modeText = C8O.util.toTrimmedString(mode).toLowerCase();
    if (!modeText.length) {
      modeText = "inside";
    }
    var allowedModes = { "inside": true, "before": true, "after": true };
    if (!allowedModes[modeText]) {
      modeText = "inside";
    }
    var classNameText = C8O.util.toTrimmedString(className);
    if (!classNameText.length) {
      throw new Error("className is required");
    }
    var nameText = C8O.util.toTrimmedString(name);
    var propertiesText = C8O.util.toTrimmedString(properties);
    
    var autoSaveInput = (typeof autoSave !== "undefined") ? autoSave : null;
    if ((autoSaveInput === null || autoSaveInput === undefined) && typeof commit !== "undefined") {
      autoSaveInput = commit;
    }
    var autoSaveFlag = C8O.util.parseAutoSaveFlag(autoSaveInput, true);
    
    var parentDbo = null;
    var siblingDbo = null;
    if (modeText === "inside") {
      parentDbo = relatedDbo;
    } else {
      siblingDbo = relatedDbo;
      parentDbo = siblingDbo.getParent();
    }
    if (parentDbo == null) {
      throw new Error("Unable to resolve parent for insert mode " + modeText);
    }
    
    var projectRef = null;
    try {
      projectRef = parentDbo.getProject();
    } catch (ignoredProject) {}
    if (projectRef == null && parentDbo instanceof ProjectClass) {
      projectRef = parentDbo;
    }
    
    var afterValue = null;
    if (modeText === "after" && siblingDbo != null) {
      afterValue = java.lang.Long.valueOf(siblingDbo.priority);
    } else if (modeText === "before" && siblingDbo != null) {
      var previous = null;
      try {
        var siblings = parentDbo.getDatabaseObjectChildren();
        for (var i = 0; i < siblings.size(); i++) {
          var child = siblings.get(i);
          if (child.getParent() !== parentDbo) {
            continue;
          }
          if (child == siblingDbo) {
            break;
          }
          previous = child;
        }
      } catch (ignoredList) {}
      if (previous != null) {
        afterValue = java.lang.Long.valueOf(previous.priority);
      } else {
        afterValue = java.lang.Long.valueOf(0);
      }
    }
    
    creationMode = modeText;
    creationRelated = String(relatedDbo.getFullQName ? relatedDbo.getFullQName() : relatedDbo.getQName());
    creationClassName = classNameText;
    creationRequestedName = nameText;
    creationProperties = propertiesText;
    creationPropertiesProvided = propertiesText.length > 0;
    creationAutoSave = autoSaveFlag;
    creationParent = parentDbo;
    creationSibling = siblingDbo;
    creationAfter = afterValue;
    creationAfterNumber = afterValue != null ? afterValue.longValue() : null;
    creationProject = projectRef;
    creationProjectName = projectRef != null ? String(projectRef.getName()) : "";
    creationSiblingQName = siblingDbo != null ? String(siblingDbo.getFullQName()) : "";
    creationTimestamp = java.lang.System.currentTimeMillis();
    
    createdObject = null;
    createdQName = "";
    createdParentQName = parentDbo != null ? String(parentDbo.getFullQName ? parentDbo.getFullQName() : parentDbo.getQName()) : "";
    createdName = "";
    createdClassName = "";
    creationSaved = false;
    creationSaveMessage = "";
    creationAutoSaveApplied = autoSaveFlag;
    creationPropertiesApplied = [];
    creationPropertiesSkipped = [];
    creationPropertiesErrors = [];
