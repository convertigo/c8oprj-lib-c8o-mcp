↓BuildResponse [steps.SimpleStep-1761219993145]: 
  comment: Build initialize result or error
  expression: |
    'var JSON_RPC_VERSION = "2.0";
    var MCP_PROTOCOL_VERSION = "2025-06-18";
    var requestIdValue = null;
    if (requestIdJson != null && String(requestIdJson).length > 0) {
      try { requestIdValue = JSON.parse(String(requestIdJson)); } catch (e) { requestIdValue = requestIdJson; }
    } else {
      requestIdValue = null;
    }
    var header = headerVersion != null ? String(headerVersion) : "";
    mcp_protocol_version = MCP_PROTOCOL_VERSION;
    mcp_has_body = true;
    if (header && header.length > 0 && header !== MCP_PROTOCOL_VERSION) {
      mcp_response_status = "400";
      mcp_response_payload = { jsonrpc: JSON_RPC_VERSION, id: requestIdValue, error: { code: -32600, message: "Unsupported MCP protocol version", data: { supported: MCP_PROTOCOL_VERSION, received: header } } };
    } else {
      mcp_response_status = "200";
      mcp_response_payload = { jsonrpc: JSON_RPC_VERSION, id: requestIdValue, result: { protocolVersion: MCP_PROTOCOL_VERSION, capabilities: { tools: { listChanged: false }, resources: { listChanged: false }, prompts: { listChanged: false }, logging: {} }, serverInfo: { name: "convertigo-mcp", title: "Convertigo MCP Server", version: "0.1.0" }, instructions: "Use Convertigo MCP tools to inspect and manage the engine." } };
    }'
