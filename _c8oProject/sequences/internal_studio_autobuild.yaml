accessibility: Private
comment: Read/set Studio mobile builder auto-build mode for a target project.
↓InitContext [steps.SimpleStep-1772114900001]: 
  comment: Resolve project and optionally change auto-build state
  expression: |
    'var Engine = Packages.com.twinsoft.convertigo.engine.Engine;
    var providedProject = project == null ? "" : String(project).trim();
    if (!providedProject.length && context && context.project) {
      providedProject = String(context.project.getName());
    }
    var enabledText = enabled == null ? "" : String(enabled).trim();
    
    var parseBoolean = function(text) {
      var lower = String(text).trim().toLowerCase();
      if (lower === "true" || lower === "1" || lower === "yes" || lower === "on") {
        return true;
      }
      if (lower === "false" || lower === "0" || lower === "no" || lower === "off") {
        return false;
      }
      throw new Error("Invalid boolean value for enabled: " + text);
    };
    
    resultTimestamp = java.lang.System.currentTimeMillis();
    resultStudioMode = Engine.isStudioMode();
    resultProject = providedProject;
    resultHasRequestedEnabled = enabledText.length > 0;
    resultRequestedEnabled = false;
    resultPreviousEnabled = false;
    resultCurrentEnabled = false;
    resultChanged = false;
    resultStatus = "error";
    resultMessage = "";
    resultError = "";
    
    try {
      if (!resultStudioMode) {
        resultStatus = "skipped";
        resultMessage = "Auto-build control skipped: Convertigo Studio required";
      } else {
        if (!providedProject.length) {
          throw new Error("Project name is required");
        }
        var projectRef = Engine.theApp.databaseObjectsManager.getOriginalProjectByName(providedProject);
        if (projectRef == null) {
          throw new Error("Project not found: " + providedProject);
        }
        var mobileBuilder = projectRef.getMobileBuilder();
        if (mobileBuilder == null) {
          throw new Error("Mobile builder unavailable for project: " + providedProject);
        }
    
        var previousEnabled = mobileBuilder.isAutoBuild();
        resultPreviousEnabled = previousEnabled;
    
        if (enabledText.length > 0) {
          var requestedEnabled = parseBoolean(enabledText);
          resultRequestedEnabled = requestedEnabled;
          if (previousEnabled !== requestedEnabled) {
            mobileBuilder.setAutoBuild(requestedEnabled);
            resultChanged = true;
          }
        }
    
        resultCurrentEnabled = mobileBuilder.isAutoBuild();
        resultStatus = "ok";
        resultMessage = "Auto-build is " + (resultCurrentEnabled ? "ON" : "OFF");
      }
    } catch (autobuildError) {
      resultStatus = "error";
      resultMessage = String(autobuildError);
      resultError = String(autobuildError);
    }'
