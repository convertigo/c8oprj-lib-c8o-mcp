accessibility: Private
comment: |
  Create or update deterministic CRUD scaffolding
  Upserts a Convertigo SQL CRUD scaffold from a structured spec (connector, transactions, business sequences, seed); the pages are built with ngx-page-create. Use the exact requested project name when it is valid; do not invent prefixes or date suffixes. If no seed profile is supplied, the default seed is realistic demo data. Entity specs may also define singular, plural, and displayLabel overrides when English inflection is not correct. On an app whose tables already hold rows it keeps them (no reset, no demo seed) and adds the columns the spec adds, filled with fields[].default; seed.reset:true resets the tables to the demo rows.
↓IncludeHelpers [steps.SimpleStep-1773318201001]: 
  comment: Load deterministic CRUD helpers
  expression: include("js/tools_crud.js");
↓Init [steps.SimpleStep-1773318201002]: 
  comment: Parse inputs and execute the CRUD upsert
  expression: |
    'crudUpsertResult = C8O.crud.upsertCrud({
      spec: spec,
      sequence: C8O.util.toBoolean(sequence, true)
    });'
