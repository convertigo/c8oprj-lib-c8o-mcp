  comment: Compute priority string for result metadata.
  expression: |
    'resultPriority = "";
    try {
      var Engine = Packages.com.twinsoft.convertigo.engine.Engine;
      var target = (qname && String(qname).length) ? Engine.theApp.databaseObjectsManager.getDatabaseObjectByQName(String(qname)) : null;
