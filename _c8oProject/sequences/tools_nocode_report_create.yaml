accessibility: Private
comment: |
  Report a Tigo friction to Convertigo
  Queues one short friction for Convertigo, for the No Code Studio user's review before it is sent (or after the turn when they chose automatic sending): a no-code tool, guide or prompt you had to work around, or a capability you needed that no no-code tool gives (seeing the saved form in a browser, reading the rows of a Baserow table, running a calculation) and that you told the user about or worked around. File it before your final answer, even when no tool failed. Listed only when the user agreed to send feedback. Describe the product problem only: never name the user's forms, pages, fields, Baserow workspaces, databases, tables or their data.
↓IncludeHelpers [steps.SimpleStep-1792730000001]: 
  comment: Load reporting helper
  expression: include("js/reporting.js");
↓Init [steps.SimpleStep-1792730000003]: 
  comment: Validate the friction and queue it in the user's feedback folder, with their consent
  expression: |
    'reportResult = C8O.reporting.writeTigoReport({
      area: area,
      subjectId: subjectId,
      severity: severity,
      summary: summary,
      suggestion: suggestion
    });
    // An invalid call answers its error whole: every missing or invalid field at once, nothing written.
    result = reportResult.error ? reportResult : { status: reportResult.status, message: reportResult.message, reportId: reportResult.reportId, createdAt: reportResult.createdAt };'
↓result [steps.JsonToXmlStep-1792730000005]: 
  jsonObject: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: JS
        - →→: result
  key: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: PLAIN
        - →→: result
↓area [variables.RequestableVariable-1792730000015]: 
  comment: 'Feedback area. Allowed values: tool, guide, prompt, scenario, fixture, product-knowledge-gap.'
  description: 'Feedback area. Allowed values: tool, guide, prompt, scenario, fixture, product-knowledge-gap.'
↓subjectId [variables.RequestableVariable-1792730000017]: 
  comment: 'Short stable identifier of the subject being reported, such as the no-code tool name.'
  description: 'Short stable identifier of the subject being reported, such as the no-code tool name.'
↓severity [variables.RequestableVariable-1792730000019]: 
  comment: 'Feedback severity. Allowed values: low, medium, high.'
  description: 'Feedback severity. Allowed values: low, medium, high.'
↓summary [variables.RequestableVariable-1792730000021]: 
  comment: 'Short reusable summary of the friction: what you expected, what happened, how you got past it. No names of the user forms, pages, fields or tables.'
  description: 'Short reusable summary of the friction: what you expected, what happened, how you got past it. No names of the user forms, pages, fields or tables.'
↓suggestion [variables.RequestableVariable-1792730000023]: 
  comment: 'Optional suggested improvement for the no-code tools, guides, or prompts.'
  description: 'Optional suggested improvement for the no-code tools, guides, or prompts.'