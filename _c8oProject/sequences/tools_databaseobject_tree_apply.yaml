↓target [variables.RequestableVariable-1772628058546]: 
  comment: Existing QName. Case-sensitive. Patched when at=self; used as the anchor when at=inside, before, or after.
  description: Existing QName. Case-sensitive. Patched when at=self; used as the anchor when at=inside, before, or after.
↓tree [variables.RequestableVariable-1772628058674]: 
  comment: 'Canonical node payload from the tree-get shape: name, className, properties, and optional children.'
  description: 'Canonical node payload from the tree-get shape: name, className, properties, and optional children.'
↓at [variables.RequestableVariable-1772628058781]: 
  comment: 'Allowed values: self, inside, before, after. self patches the target; the others place the input tree relative to it.'
  description: 'Allowed values: self, inside, before, after. self patches the target; the others place the input tree relative to it.'
  value: self
↓onError [variables.RequestableVariable-1772628058934]: 
  comment: 'Allowed values: stop or continue. continue keeps later operations running and reports failures.'
  description: 'Allowed values: stop or continue. continue keeps later operations running and reports failures.'
  value: stop
↓strict [variables.RequestableVariable-1772628059044]: 
  comment: Set true to force stop-on-error behavior even if onError=continue.
  description: Set true to force stop-on-error behavior even if onError=continue.
  value: false
↓autoSave [variables.RequestableVariable-1772628059143]: 
  comment: Default true. Saves touched projects after the mutation batch.
  description: Default true. Saves touched projects after the mutation batch.
  value: true
↓refresh [variables.RequestableVariable-1772628059244]: 
  comment: Default true. Refreshes the Studio tree from the computed common ancestor.
  description: Default true. Refreshes the Studio tree from the computed common ancestor.
