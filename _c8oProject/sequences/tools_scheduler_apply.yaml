accessibility: Private
comment: |
  Schedule or unschedule a sequence
  upsert creates or replaces one scheduled sequence run named name: a sequence job, a CRON schedule (Quartz syntax with seconds, e.g. 0 0 8 * * ? for 08:00 daily) and the scheduled job linking them, saved in the engine scheduler and active at once when enabled. delete removes them. Use scheduler-list first; scheduling runs the sequence with no user session.
↓Include [steps.SimpleStep-1792171000051]: 
  expression: include("js/tools_scheduler.js");
↓Run [steps.SimpleStep-1792171000052]: 
  expression: 'var schedulerResult = C8O.scheduler.apply({action: action, name: name, project: project, sequence: sequence, cron: cron, enabled: enabled, parameters: parameters, context: contextName, writeOutput: writeOutput, description: description});'
↓result [steps.JsonToXmlStep-1792171000053]: 
  jsonObject: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: JS
        - →→: schedulerResult
  key: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: PLAIN
        - →→: result
↓action [variables.RequestableVariable-1792171000054]: 
