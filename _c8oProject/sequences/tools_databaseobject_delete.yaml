↓Init [steps.SimpleStep-1762369237566]: 
  comment: Resolve target and execute removal
  expression: |
    'var commitFlag = C8O.util.parseCommitFlag(commit, true);
    var removal = C8O.dbo.removeObject({ qname: qname });
    
    deleteInfo = removal;
    deleteErrors = Array.isArray(removal.errors) ? removal.errors : [];
    deleteCommit = commitFlag;
    deleteProject = removal.project || null;
    deleteExported = false;
    deleteExportMessage = "";
    deleteSuccess = Boolean(removal.removed);
    deleteParentQName = removal.parentQName || "";
    deleteClassName = removal.className || "";
    deleteProjectName = removal.projectName || "";
    deleteSummaryRemoved = deleteSuccess ? 1 : 0;
    deleteSummaryErrors = deleteErrors.length;
    deleteShouldRefresh = deleteSuccess && deleteParentQName.length > 0;'
↓Export [steps.SimpleStep-1762369246170]: 
  comment: Export project when requested
  expression: |
    var exportResult = C8O.dbo.exportProjectIfNeeded(deleteProject, deleteCommit, deleteErrors);
    deleteExported = exportResult.exported;
    deleteExportMessage = exportResult.message || "";
