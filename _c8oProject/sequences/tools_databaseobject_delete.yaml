  condition: deleteShouldRefresh
  ↓PrepareRefreshCall [steps.SimpleStep-1762369264083]: 
    comment: Preserve qname scope and target parent
    expression: |
      'previousRefreshQNameDefined = typeof qname !== "undefined" && qname !== null;
      previousRefreshQNameValue = previousRefreshQNameDefined ? qname : null;
      qname = deleteParentQName;'
  ↓CallInternalStudioRefresh [steps.SequenceStep-1762369274549]: 
    comment: Trigger Studio refresh on deleted parent node
