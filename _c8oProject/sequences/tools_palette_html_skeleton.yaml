accessibility: Private
comment: |
  Return an authoring HTML/SCSS/text skeleton for one frontend palette entry
  Resolves a palette class against an existing parent QName, prefers the same canonical metadata as `palette-json-skeleton`, then instantiates the palette entry live and returns an authoring surface suitable for `_private/ionic` edits and round-trip import. The response keeps the JSON skeleton metadata plus `authoring` (`surface=html|scss|text`) so agents can compose frontend markup without mining other projects for examples.
