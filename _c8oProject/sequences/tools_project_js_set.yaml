accessibility: Private
comment: |
  Write a project helper script
  Creates or replaces one file under the js/ directory of the given project. Send the complete file content in content, or the path of a workspace file in contentFile (preferred for large scripts); partial patches are not supported and the response never echoes the content. A sequence loads it with a first SimpleStep whose expression is include("js/<file>.js"); see convertigo-backend-sequences section 5.
↓InitContext [steps.SimpleStep-1762350567267]: 
  comment: Validate input and persist file content
  expression: |
    'var projectName = project == null ? "" : String(project).trim();
    if (!projectName.length) { throw new Error("project is required: the technical name of the project whose js/ folder you want to write"); }
    if (context && context.project && projectName === String(context.project.getName())) { throw new Error("Writing into the js/ folder of the running MCP server project is forbidden"); }
    var dboManager = Packages.com.twinsoft.convertigo.engine.Engine.theApp.databaseObjectsManager;
    if (!dboManager.existsProject(projectName)) { throw new Error("Unknown project: " + projectName); }
    var targetProject = dboManager.getOriginalProjectByName(projectName, false);
    var jsDir = new java.io.File(targetProject.getDirPath(), "js");
    var filenameText = filename == null ? "" : String(filename).trim();
    if (!filenameText.length) { throw new Error("filename is required"); }
    var normalized = filenameText.replace(/\\/g, "/");
    while (normalized.indexOf("//") >= 0) { normalized = normalized.replace("//", "/"); }
    if (normalized.startsWith("/")) { normalized = normalized.substring(1); }
    if (normalized.indexOf("js/") === 0) { normalized = normalized.substring(3); }
    requestedName = normalized;
    var baseFile = jsDir.getCanonicalFile();
    var basePath = baseFile.toPath();
    var targetFile = new java.io.File(baseFile, normalized).getCanonicalFile();
    var targetPath = targetFile.toPath();
    if (!targetPath.startsWith(basePath)) { throw new Error("Invalid filename: " + normalized); }
    var parentDir = targetFile.getParentFile();
    java.nio.file.Files.createDirectories(parentDir.toPath());
    var existed = targetFile.exists();
    var contentFileText = (typeof contentFile !== "undefined" && contentFile != null) ? String(contentFile).trim() : "";
    var textContent = content == null ? "" : String(content);
    if (contentFileText.length) {
      if (textContent.length) { throw new Error("Pass either content or contentFile, not both."); }
      var wsRoot = new java.io.File(String(Packages.com.twinsoft.convertigo.engine.Engine.PROJECTS_PATH)).getCanonicalFile();
      var sourceFile = new java.io.File(contentFileText);
      if (!sourceFile.isAbsolute()) { sourceFile = new java.io.File(wsRoot, contentFileText); }
      sourceFile = sourceFile.getCanonicalFile();
      if (!sourceFile.toPath().startsWith(wsRoot.toPath())) { throw new Error("contentFile must be inside the projects workspace " + wsRoot.getPath()); }
      if (!sourceFile.isFile()) { throw new Error("contentFile not found: " + sourceFile.getPath()); }
      if (sourceFile.length() > 5242880) { throw new Error("contentFile is larger than 5 MB."); }
      textContent = String(new java.lang.String(java.nio.file.Files.readAllBytes(sourceFile.toPath()), "UTF-8"));
    }
    var bytes = new java.lang.String(textContent).getBytes(java.nio.charset.StandardCharsets.UTF_8);
    java.nio.file.Files.write(
      targetPath,
      bytes,
      java.nio.file.StandardOpenOption.CREATE,
      java.nio.file.StandardOpenOption.TRUNCATE_EXISTING,
      java.nio.file.StandardOpenOption.WRITE
    );
    resultStatus = "written";
    resultMessage = existed ? "File updated" : "File created";
    resultCreated = !existed;
    resultBytes = bytes.length;
    resultTimestamp = java.lang.System.currentTimeMillis();
    fileCanonicalPath = String(targetFile.getPath());
    fileRelativePath = basePath.relativize(targetPath).toString();
    fileExists = true;
    directoryExists = true;
    fileContent = "";'
