  expression: |
    'function splitComment(text) {
      if (!text) { return { title: "", description: "" }; }
      text = ("" + text).trim();
      if (text.length === 0) { return { title: "", description: "" }; }
      var parts = text.split(/\r?\n/);
      var title = parts[0].trim();
      var description = "";
      if (parts.length > 1) { description = parts.slice(1).join("\n").trim(); }
      return { title: title, description: description };
    }
    
    var tokens = sequence.split("_");
    var category = tokens[1];
    var toolName = tokens.slice(2).join("_");
    var meta = splitComment(context.project.getSequenceByName(sequence).getComment());'
