comment: Returns metadata and property values for a database object identified by its QName.
↓Init [steps.SimpleStep-1762266930543]: 
  comment: Collect bean information and properties list
  expression: |
    'var Engine = Packages.com.twinsoft.convertigo.engine.Engine;
    var CachedIntrospector = Packages.com.twinsoft.convertigo.engine.util.CachedIntrospector;
    var MySimpleBeanInfo = Packages.com.twinsoft.convertigo.beans.core.MySimpleBeanInfo;
    var ITagsProperty = Packages.com.twinsoft.convertigo.beans.core.ITagsProperty;
    var EnumUtils = Packages.com.twinsoft.convertigo.engine.util.EnumUtils;
    
    if (!qname || String(qname).trim().length === 0) { throw new Error("qname is required"); }
    qname = String(qname);
    var dbo = Engine.theApp.databaseObjectsManager.getDatabaseObjectByQName(qname);
    if (dbo == null) { throw new Error("Database object not found: " + qname); }
    
    var beanInfo = CachedIntrospector.getBeanInfo(dbo.getClass());
    var descriptors = beanInfo.getPropertyDescriptors();
    var properties = [];
    var categories = [];
    
    function pushCategory(category) {
      if (categories.indexOf(category) === -1) {
        categories.push(category);
      }
    }
    
    for (var i = 0; i < descriptors.length; i++) {
      var pd = descriptors[i];
      var getter = pd.getReadMethod();
      if (getter == null) { continue; }
      var name = pd.getName();
      if (name === "class") { continue; }
      var entry = {};
      entry.name = name;
      entry.displayName = pd.getDisplayName() != null ? String(pd.getDisplayName()) : name;
      entry.description = pd.getShortDescription() != null ? String(pd.getShortDescription()) : "";
      entry.hidden = Boolean(pd.isHidden());
      entry.expert = Boolean(pd.isExpert());
      var category = pd.getValue(MySimpleBeanInfo.CATEGORY);
      if (category == null || String(category).trim().length === 0) {
        category = pd.isExpert() ? "Expert" : "Base properties";
      } else {
        category = String(category);
      }
      entry.category = category;
      pushCategory(category);
      entry.disabled = Boolean(java.lang.Boolean.TRUE.equals(pd.getValue(MySimpleBeanInfo.DISABLE)));
      entry.multiline = Boolean(java.lang.Boolean.TRUE.equals(pd.getValue(MySimpleBeanInfo.MULTILINE)));
      entry.scriptable = Boolean(java.lang.Boolean.TRUE.equals(pd.getValue(MySimpleBeanInfo.SCRIPTABLE)));
      var propertyType = pd.getPropertyType();
      entry.type = propertyType != null ? propertyType.getName() : "";
      var value = null;
      try { value = getter.invoke(dbo, null); } catch (e) { value = null; }
      entry.valueClass = value != null ? value.getClass().getName() : "";
      entry.valuePreview = value != null ? String(value) : "";
      var sourceValue = dbo.getCompilablePropertySourceValue(name);
      entry.sourceValue = sourceValue != null ? String(sourceValue) : "";
      entry.ciphered = Boolean(dbo.isCipheredProperty(name));
      entry.traceable = Boolean(dbo.isTraceableProperty(name));
      var nillable = java.lang.Boolean.TRUE.equals(pd.getValue(MySimpleBeanInfo.NILLABLE));
      entry.nillable = Boolean(nillable);
      var isNullFlag = false;
      if (nillable) {
        try {
          var isNullMethod = dbo.getClass().getMethod("isNullProperty", [java.lang.String.class]);
          isNullFlag = Boolean(java.lang.Boolean.TRUE.equals(isNullMethod.invoke(dbo, [name])));
        } catch (ignore) {}
      }
      entry.isNull = isNullFlag;
      var editorClass = pd.getPropertyEditorClass();
      entry.editorClass = editorClass != null ? editorClass.getName() : "";
      var possibleValues = [];
      if (dbo instanceof ITagsProperty) {
        try {
          var tags = dbo.getTagsForProperty(name);
          if (tags != null) {
            for (var t = 0; t < tags.length; t++) {
              possibleValues.push(String(tags[t]));
            }
          }
        } catch (ignore) {}
      } else if (editorClass != null) {
        try {
          var names = EnumUtils.toNames(editorClass);
          if (names != null) {
            for (var n = 0; n < names.length; n++) {
              possibleValues.push(String(names[n]));
            }
          }
        } catch (ignore) {}
      }
      entry.possibleValues = possibleValues;
      properties.push(entry);
    }
    
    var propertiesList = properties;
    var propertiesCount = properties.length;
    var categoriesList = categories;
    var targetClassName = dbo.getClass().getName();
    var beanDescriptor = beanInfo.getBeanDescriptor();
    var beanDisplayName = beanDescriptor != null && beanDescriptor.getDisplayName() != null ? String(beanDescriptor.getDisplayName()) : "";'
