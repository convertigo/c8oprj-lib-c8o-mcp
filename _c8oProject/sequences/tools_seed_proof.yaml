accessibility: Private
comment: |
  Prove that a seed is replayable
  One call: counts the tables a seed writes (SELECT COUNT(*) on a read-only connection), runs the seed as requestable-execute does, counts, runs it again and counts. verdict replayable only when both runs answered ok and the second run left every count as the first left it; failed otherwise, with reasons. An answer with status error blocks every success report about the seed: counts unchanged after an error prove nothing. freshRun true when every counted table was empty before the first run: that run is also the fresh-server proof; otherwise it proves the replay on existing data only. Default tables: the ones the SQL transactions reached by the seed insert into, update, merge into or delete from; writes it cannot count (CouchDB, FullSync, HTTP) come in notCounted. It never empties nor deletes a row and changes nothing in the project; the two runs write the application's data as the seed does.
