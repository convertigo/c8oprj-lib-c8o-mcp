  comment: Optional Claude Code config directory (CLAUDE_CONFIG_DIR). Defaults to ~/.claude on the local Studio machine.
  description: Optional Claude Code config directory (CLAUDE_CONFIG_DIR). Defaults to ~/.claude on the local Studio machine.
