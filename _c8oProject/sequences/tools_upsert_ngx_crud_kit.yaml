accessibility: Private
comment: |
  Create or update a deterministic NGX CRUD kit
  Replaces the visible starter entry page content with a deterministic CRUD/dashboard shell and shared UI state blocks.
↓IncludeHelpers [steps.SimpleStep-1773318401001]: 
  comment: Load deterministic CRUD helpers
  expression: include("js/tools_crud.js");
↓Init [steps.SimpleStep-1773318401002]: 
  comment: Parse entities and apply the visible NGX CRUD shell
  expression: |
    'function parseEntitiesInput(value) {
      if (Array.isArray(value)) {
        return value;
      }
      if (value != null && Object.prototype.toString.call(value) === ''[object Object]'') {
        return value;
      }
      var text = C8O.util.toTrimmedString(value);
      if (!text.length) {
        return [];
      }
      var candidate = text;
      for (var depth = 0; depth < 3; depth++) {
        var parsed = JSON.parse(candidate);
        if (Array.isArray(parsed) || (parsed != null && Object.prototype.toString.call(parsed) === ''[object Object]'')) {
          return parsed;
        }
        if (typeof parsed === ''string'' && C8O.util.toTrimmedString(parsed).length) {
          candidate = C8O.util.toTrimmedString(parsed);
          continue;
        }
        break;
      }
      throw new Error(''entities must be a JSON object or array'');
    }
    var parsedEntities = parseEntitiesInput(entities);
    var parsedRuntimeEvidence = C8O.util.parseObjectInput(runtimeEvidence, {
      label: ''runtimeEvidence'',
      allowEmpty: true
    });
    crudUiResult = C8O.crud.upsertNgxCrudKit({
      project: project,
      entities: parsedEntities,
      variant: variant,
      facadePrefix: facadePrefix,
      entryPage: entryPage,
      runtimeEvidence: parsedRuntimeEvidence
    });'
