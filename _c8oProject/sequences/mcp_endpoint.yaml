    '// A previous call on this HTTP session may have scheduled its invalidation
    // (terminateSession on the /mcp mapping). Clients that replay the JSESSIONID
    // cookie would otherwise lose this call at the next Tomcat expiry sweep, while
    // stateless clients get a fresh session and are unaffected. Re-arm it now.
    try {
      if (context.httpSession != null) {
        var mcpSessionTimeout = 600;
        try { mcpSessionTimeout = parseInt(String(context.project.getHttpSessionTimeout()), 10) || 600; } catch (_ignoreProjectTimeout) {}
        context.httpSession.setMaxInactiveInterval(mcpSessionTimeout);
      }
    } catch (_ignoreSessionRearm) {}
    
    var TOOL_CALL_INTERRUPTED = /Parent context stopped|already been invalidated|Session already invalidated/i;
    function formatToolErrorObject(err) {
      err = err && err.error ? err.error : (err || {});
      var probe = [err.message, err.details, err.exception, err.context].join("\n");
      if (TOOL_CALL_INTERRUPTED.test(probe)) {
        return { code: "server_call_interrupted", message: "The MCP call was interrupted on the server because its HTTP session ended during execution. Retry the same call once with identical arguments before trying anything else.", details: err.message || "", context: err.context || "", exception: err.exception || "", attr: err.attr || {} };
      }
      // A tool script error arrives wrapped in the generic engine message; lift the message of the script.
      var scriptError = /A Javascript error has occured: (?:Error: )?([\s\S]*?)(?: \([^()]*#\d+\))?\s*$/.exec(String(err.details || ""));
      var message = scriptError && scriptError[1] ? scriptError[1].trim() : (err.message || "Tool call failed");
      return { code: err.code || "", message: message, details: err.details || "", context: err.context || "", exception: err.exception || "", attr: err.attr || {} };
    }
    function formatToolErrorText(err) {
      return JSON.stringify(formatToolErrorObject(err));
    }
    
    const Engine = Packages.com.twinsoft.convertigo.engine.Engine;
    
    const JSON_RPC_VERSION = "2.0";
    const SUPPORTED_PROTOCOL = "2025-06-18";
    
    var headerVersion = SUPPORTED_PROTOCOL;
    var guidanceHeaderVersion = "";
