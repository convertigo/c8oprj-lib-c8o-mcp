      if (header != null) {
        headerVersion = String(header);
      }
      var guidanceHeader = context.httpServletRequest.getHeader("X-Convertigo-Guidance-Version");
      if (guidanceHeader == null) {
        guidanceHeader = context.httpServletRequest.getHeader("Convertigo-Guidance-Version");
      }
      if (guidanceHeader != null) {
        guidanceHeaderVersion = String(guidanceHeader);
      }
    }
    
