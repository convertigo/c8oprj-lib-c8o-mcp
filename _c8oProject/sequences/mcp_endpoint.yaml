      var header = context.httpServletRequest.getHeader("MCP-Protocol-Version");
      if (header != null) {
        headerVersion = String(header);
      }
      var guidanceHeader = context.httpServletRequest.getHeader("X-Convertigo-Guidance-Version");
      if (guidanceHeader == null) {
        guidanceHeader = context.httpServletRequest.getHeader("Convertigo-Guidance-Version");
      }
      if (guidanceHeader != null) {
        guidanceHeaderVersion = String(guidanceHeader);
      }
      if (!guidanceHeaderVersion.length) {
        var descriptorVersion = context.httpServletRequest.getParameter("descriptorVersion");
        if (descriptorVersion != null) {
          guidanceHeaderVersion = String(descriptorVersion);
        }
      }
