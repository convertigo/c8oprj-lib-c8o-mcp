comment: Lists palette categories and database object templates allowed under a parent.
↓InitContext [steps.SimpleStep-1762338110018]: 
  comment: Prepare helpers and resolve parent
  expression: |
    'var Engine = Packages.com.twinsoft.convertigo.engine.Engine;
    var DatabaseObject = Packages.com.twinsoft.convertigo.beans.core.DatabaseObject;
    
    var targetRaw = target == null ? "" : String(target).trim();
    var includeDynamicFlag = true;
    if (includeDynamic != null && String(includeDynamic).length > 0) {
      includeDynamicFlag = /true/i.test(String(includeDynamic));
    }
    
    var parentDbo = null;
    var folderTypeValue = "";
    if (targetRaw.length > 0) {
      var candidates = [];
      candidates.push(targetRaw);
      var lower = targetRaw.toLowerCase();
      if (lower !== targetRaw) {
        candidates.push(lower);
      }
      var colonIndex = targetRaw.indexOf(":");
      if (colonIndex !== -1) {
        var leftPart = targetRaw.substring(0, colonIndex);
        var namePart = targetRaw.substring(colonIndex + 1);
        var dotIndex = leftPart.lastIndexOf(".");
        if (dotIndex !== -1) {
          var base = leftPart.substring(0, dotIndex);
          var suffix = namePart;
          var suffixLower = namePart.toLowerCase();
          candidates.push(leftPart + ":" + suffixLower);
          candidates.push(base + "." + suffix);
          if (suffixLower !== suffix) {
            candidates.push(base + "." + suffixLower);
          }
        }
      }
      for (var i = 0; i < candidates.length; i++) {
        try {
          parentDbo = Engine.theApp.databaseObjectsManager.getDatabaseObjectByQName(candidates[i]);
          if (parentDbo != null) {
            break;
          }
        } catch (ignoredCandidates) {}
      }
    }
    
    var parentQNameValue = parentDbo != null ? parentDbo.getQName() : "";
    var parentClassNameValue = parentDbo != null ? parentDbo.getClass().getName() : "";
    
    paletteCategories = [];
    categoryIndex = {};
    paletteParent = parentDbo;
    paletteFolderType = null;
    paletteIncludeDynamic = includeDynamicFlag ? true : false;
    
    resultInfo = {
      target: targetRaw,
      parentQName: parentQNameValue,
      parentClass: parentClassNameValue,
      folderType: folderTypeValue,
      includeDynamic: paletteIncludeDynamic,
      categories: 0
    };
    
    function ensureCategory(name, type) {
      var catName = name && name.length ? name : "General";
      var key = catName.toLowerCase();
      var existing = categoryIndex[key];
      if (!existing) {
        existing = { name: catName, type: type || "Category", items: [] };
        categoryIndex[key] = existing;
        paletteCategories.push(existing);
      }
      return existing;
    }
    
    function splitDescription(raw) {
      if (!raw) {
        return { short: "", long: "" };
      }
      var parts = String(raw).split("|");
      var shortDesc = parts.length > 0 ? parts[0].trim() : "";
      var longDesc = parts.length > 1 ? parts.slice(1).join("|").trim() : "";
      return { short: shortDesc, long: longDesc };
    }
    
    ensureCategoryRef = ensureCategory;
    splitDescriptionRef = splitDescription;
    '
↓LoadBeans [steps.SimpleStep-1762338110020]: 
  comment: Collect palette beans from explorer
  expression: |
    'var Engine = Packages.com.twinsoft.convertigo.engine.Engine;
    var DatabaseObjectsManager = Packages.com.twinsoft.convertigo.engine.DatabaseObjectsManager;
    var DatabaseObject = Packages.com.twinsoft.convertigo.beans.core.DatabaseObject;
    var MySimpleBeanInfo = Packages.com.twinsoft.convertigo.beans.core.MySimpleBeanInfo;
    var BeanInfo = Packages.java.beans.BeanInfo;
    
    var parentDbo = paletteParent;
    var folderType = paletteFolderType;
    
    var explorer = Engine.theApp.getDboExplorerManager();
    var groups = explorer.getGroups();
    var groupIt = groups.iterator();
    while (groupIt.hasNext()) {
      var group = groupIt.next();
      var groupName = group.getName();
      var categoryIt = group.getCategories().iterator();
      while (categoryIt.hasNext()) {
        var category = categoryIt.next();
        var categoryName = category.getName().isEmpty() ? groupName : category.getName();
        var beansIt = category.getBeans().iterator();
        while (beansIt.hasNext()) {
          var beans = beansIt.next();
          var catLabel = beans.getName().isEmpty() ? categoryName : beans.getName();
          var beanIt = beans.getBeans().iterator();
          while (beanIt.hasNext()) {
            var bean = beanIt.next();
            var className = bean.getClassName();
            if ((className.startsWith("com.twinsoft.convertigo.beans.ngx.components.") ||
                 className.startsWith("com.twinsoft.convertigo.beans.mobile.components.")) &&
                !className.endsWith("PageComponent")) {
              continue;
            }
    
            var isAllowed = false;
            try {
              var force = false;
              if (parentDbo != null) {
                if (parentDbo instanceof Packages.com.twinsoft.convertigo.beans.core.Sequence) {
                  force = className.startsWith("com.twinsoft.convertigo.beans.steps.") ||
                          className.startsWith("com.twinsoft.convertigo.beans.variables.Step");
                } else if (parentDbo instanceof Packages.com.twinsoft.convertigo.beans.ngx.components.ApplicationComponent) {
                  force = className.startsWith("com.twinsoft.convertigo.beans.ngx.");
                } else if (parentDbo instanceof Packages.com.twinsoft.convertigo.beans.mobile.components.ApplicationComponent) {
                  force = className.startsWith("com.twinsoft.convertigo.beans.mobile.");
                }
              }
              if (parentDbo != null) {
                isAllowed = force || DatabaseObjectsManager.checkParent(parentDbo.getClass(), bean);
              }
              if (folderType != null && isAllowed) {
                isAllowed = DatabaseObject.getFolderType(Packages.java.lang.Class.forName(className)) == folderType;
              }
            } catch (eCheck) {}
    
            if (!isAllowed) {
              continue;
            }
    
            try {
              var beanInfoClass = Packages.java.lang.Class.forName(className + "BeanInfo");
              var beanInfo = beanInfoClass.getConstructor().newInstance();
              var descriptor = beanInfo.getBeanDescriptor();
              var description = bean.isDocumented() ? descriptor.getShortDescription() : "Not yet documented |";
              var descParts = splitDescriptionRef(description);
              var iconPath = MySimpleBeanInfo.getIconName(beanInfo, BeanInfo.ICON_COLOR_32x32);
              var categoryObj = ensureCategoryRef(catLabel, "Category");
              categoryObj.items.push({
                type: "dbo",
                id: className,
                name: descriptor.getDisplayName(),
                className: className,
                description: description,
                shortDescription: descParts.short,
                longDescription: descParts.long,
                icon: iconPath,
                builtin: true,
                additional: false,
                group: groupName,
                category: catLabel
              });
            } catch (eInfo) {}
          }
        }
      }
    }
    '
