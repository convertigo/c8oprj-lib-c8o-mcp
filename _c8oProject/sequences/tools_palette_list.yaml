↓LoadBeans [steps.SimpleStep-1762338110020]: 
  comment: Collect palette beans from explorer
  expression: |
    'var Engine = Packages.com.twinsoft.convertigo.engine.Engine;
    var DatabaseObjectsManager = Packages.com.twinsoft.convertigo.engine.DatabaseObjectsManager;
    var DatabaseObject = Packages.com.twinsoft.convertigo.beans.core.DatabaseObject;
    var MySimpleBeanInfo = Packages.com.twinsoft.convertigo.beans.core.MySimpleBeanInfo;
    var BeanInfo = Packages.java.beans.BeanInfo;
    
    var parentDbo = paletteParent;
    var folderType = paletteFolderType;
    var filterInfo = paletteFilterInfo || { hasFilter: false, text: "" };
    var limitValue = paletteLimit > 0 ? paletteLimit : 0;
    var startIndex = paletteStartIndex > 0 ? paletteStartIndex : 0;
    var totalMatches = 0;
    var windowCount = 0;
    var hasMore = false;
    var stopCollect = false;
    
    var explorer = Engine.theApp.getDboExplorerManager();
    var groups = explorer.getGroups();
    var groupIt = groups.iterator();
    while (groupIt.hasNext() && !stopCollect) {
      var group = groupIt.next();
      var groupName = group.getName();
      var categoryIt = group.getCategories().iterator();
      while (categoryIt.hasNext() && !stopCollect) {
        var category = categoryIt.next();
        var categoryName = category.getName().isEmpty() ? groupName : category.getName();
        var beansIt = category.getBeans().iterator();
        while (beansIt.hasNext() && !stopCollect) {
          var beans = beansIt.next();
          var catLabel = beans.getName().isEmpty() ? categoryName : beans.getName();
          var beanIt = beans.getBeans().iterator();
          while (beanIt.hasNext()) {
            var bean = beanIt.next();
            var classFqcn = bean.getClassName();
            var className = C8O.util && C8O.util.fromFqcn ? C8O.util.fromFqcn(classFqcn) : String(classFqcn || "");
            if ((classFqcn.indexOf("com.twinsoft.convertigo.beans.ngx.components.") === 0 ||
                classFqcn.indexOf("com.twinsoft.convertigo.beans.mobile.components.") === 0) &&
                classFqcn.indexOf("PageComponent") === -1) {
              continue;
            }
    
            var isAllowed = parentDbo == null;
            try {
              var force = false;
              if (parentDbo != null) {
                if (parentDbo instanceof Packages.com.twinsoft.convertigo.beans.core.Sequence) {
                  force = classFqcn.indexOf("com.twinsoft.convertigo.beans.steps.") === 0 ||
                            classFqcn.indexOf("com.twinsoft.convertigo.beans.variables.Step") === 0;
                } else if (parentDbo instanceof Packages.com.twinsoft.convertigo.beans.ngx.components.ApplicationComponent) {
                  force = classFqcn.indexOf("com.twinsoft.convertigo.beans.ngx.") === 0;
                } else if (parentDbo instanceof Packages.com.twinsoft.convertigo.beans.mobile.components.ApplicationComponent) {
                  force = classFqcn.indexOf("com.twinsoft.convertigo.beans.mobile.") === 0;
                }
              }
              if (parentDbo != null) {
                isAllowed = force || DatabaseObjectsManager.checkParent(parentDbo.getClass(), bean);
              }
              if (folderType != null && folderType.length && isAllowed) {
                isAllowed = DatabaseObject.getFolderType(Packages.java.lang.Class.forName(classFqcn)) == folderType;
              }
            } catch (eCheck) {}
    
            if (!isAllowed) {
              continue;
            }
    
            try {
              var beanInfoClass = Packages.java.lang.Class.forName(classFqcn + "BeanInfo");
              var beanInfo = beanInfoClass.getConstructor().newInstance();
              var descriptor = beanInfo.getBeanDescriptor();
              var description = bean.isDocumented() ? descriptor.getShortDescription() : "Not yet documented |";
              var descParts = splitDescriptionRef(description);
              var iconPath = MySimpleBeanInfo.getIconName(beanInfo, BeanInfo.ICON_COLOR_32x32);
              var entry = {
                type: "dbo",
                id: className,
                name: descriptor.getDisplayName(),
                className: className,
                description: description,
                shortDescription: descParts.short,
                longDescription: descParts.long,
                icon: iconPath,
                builtin: true,
                additional: false,
                group: groupName,
                category: catLabel
              };
    
              if (filterInfo.hasFilter) {
                var ft = filterInfo.text;
                var matches = false;
                function contains(value) {
                  return value && String(value).toLowerCase().indexOf(ft) != -1;
                }
                if (contains(entry.name) || contains(entry.className) || contains(entry.shortDescription) ||
                    contains(entry.longDescription) || contains(entry.description) || contains(entry.group) ||
                    contains(entry.category)) {
                  matches = true;
                }
                if (!matches) {
                  continue;
                }
              }
    
              totalMatches++;
              if (totalMatches <= startIndex) {
                continue;
              }
    
              if (limitValue > 0 && windowCount >= limitValue) {
                hasMore = true;
                paletteHasMore = true;
                paletteNextCursor = String(startIndex + windowCount);
                resultInfo.hasMore = true;
                resultInfo.nextCursor = paletteNextCursor;
                stopCollect = true;
                break;
              }
    
              windowCount++;
              paletteItemCount++;
    
              try {
                C8O.palette.attachListEntrySummary(entry, { displayName: entry.name, beanInfo: beanInfo });
              } catch (_ignoreSummary) {}
    
              var infoCounts = null;
              try {
                infoCounts = C8O.palette.computeListEntryCounts(classFqcn);
                if (infoCounts && infoCounts.propertyCount != null) {
                  entry.propertyCount = infoCounts.propertyCount;
                }
              } catch (_ignoreCounts) {}
    
              var cat = ensureCategoryRef(catLabel, "Category");
              cat.items.push(entry);
              if (limitValue > 0 && paletteItemCount >= limitValue) {
                hasMore = true;
                paletteHasMore = true;
                paletteNextCursor = String(startIndex + paletteItemCount);
                resultInfo.hasMore = true;
                resultInfo.nextCursor = paletteNextCursor;
                stopCollect = true;
                break;
              }
            } catch (_ignoreBean) {}
          }
        }
      }
    }
    
    resultInfo.categories = paletteCategories.length;
    resultInfo.returned = paletteItemCount;
    resultInfo.totalMatches = totalMatches;
    resultInfo.nextCursor = paletteNextCursor;
    resultInfo.hasMore = paletteHasMore;
    paletteTotalMatches = totalMatches;'
↓AugmentEntries [steps.SimpleStep-1763034311544]: 
  comment: Compute property hints and creation templates
  expression: |
    'if (typeof C8O !== "undefined" && C8O.palette && paletteCategories) {
      for (var i = 0; i < paletteCategories.length; i++) {
        var category = paletteCategories[i];
        if (!category || !category.items) {
          continue;
        }
        for (var j = 0; j < category.items.length; j++) {
          var item = category.items[j];
          if (!item || !item.className) {
            continue;
          }
          var classNameValue = String(item.className);
          item.className = classNameValue;
          try {
            item.nameSuggestion = C8O.palette.suggestTechnicalName(item.name || classNameValue);
          } catch (_ignoreSuggestion) {
            if (!item.nameSuggestion) {
              item.nameSuggestion = classNameValue;
            }
          }
          item.describe = {
            tool: "palette-describe",
            arguments: {
              className: classNameValue
            }
          };
        }
      }
    }
    '
