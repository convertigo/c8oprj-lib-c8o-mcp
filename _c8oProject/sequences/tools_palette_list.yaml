↓LoadBeans [steps.SimpleStep-1762338110020]: 
  comment: Collect palette beans from explorer
  expression: |
    'var Engine = Packages.com.twinsoft.convertigo.engine.Engine;
    var DatabaseObjectsManager = Packages.com.twinsoft.convertigo.engine.DatabaseObjectsManager;
    var DatabaseObject = Packages.com.twinsoft.convertigo.beans.core.DatabaseObject;
    var MySimpleBeanInfo = Packages.com.twinsoft.convertigo.beans.core.MySimpleBeanInfo;
    var BeanInfo = Packages.java.beans.BeanInfo;
    
    var parentDbo = paletteParent;
    var folderType = paletteFolderType;
    var filterInfo = paletteFilterInfo || { hasFilter: false, text: "" };
    var limitValue = paletteLimit > 0 ? paletteLimit : 0;
    var startIndex = paletteStartIndex > 0 ? paletteStartIndex : 0;
    var totalMatches = 0;
    var windowCount = 0;
    var hasMore = false;
    var stopCollect = false;
    
    var explorer = Engine.theApp.getDboExplorerManager();
    var groups = explorer.getGroups();
    var groupIt = groups.iterator();
    while (groupIt.hasNext() && !stopCollect) {
      var group = groupIt.next();
      var groupName = group.getName();
      var categoryIt = group.getCategories().iterator();
      while (categoryIt.hasNext() && !stopCollect) {
        var category = categoryIt.next();
        var categoryName = category.getName().isEmpty() ? groupName : category.getName();
        var beansIt = category.getBeans().iterator();
        while (beansIt.hasNext() && !stopCollect) {
          var beans = beansIt.next();
          var catLabel = beans.getName().isEmpty() ? categoryName : beans.getName();
          var beanIt = beans.getBeans().iterator();
          while (beanIt.hasNext()) {
            var bean = beanIt.next();
            var className = bean.getClassName();
            if ((className.startsWith("com.twinsoft.convertigo.beans.ngx.components.") ||
                className.startsWith("com.twinsoft.convertigo.beans.mobile.components.")) &&
                !className.endsWith("PageComponent")) {
              continue;
            }
    
            var isAllowed = parentDbo == null;
            try {
              var force = false;
              if (parentDbo != null) {
                if (parentDbo instanceof Packages.com.twinsoft.convertigo.beans.core.Sequence) {
                  force = className.startsWith("com.twinsoft.convertigo.beans.steps.") ||
                            className.startsWith("com.twinsoft.convertigo.beans.variables.Step");
                } else if (parentDbo instanceof Packages.com.twinsoft.convertigo.beans.ngx.components.ApplicationComponent) {
                  force = className.startsWith("com.twinsoft.convertigo.beans.ngx.");
                } else if (parentDbo instanceof Packages.com.twinsoft.convertigo.beans.mobile.components.ApplicationComponent) {
                  force = className.startsWith("com.twinsoft.convertigo.beans.mobile.");
                }
              }
              if (parentDbo != null) {
                isAllowed = force || DatabaseObjectsManager.checkParent(parentDbo.getClass(), bean);
              }
              if (folderType != null && folderType.length && isAllowed) {
                isAllowed = DatabaseObject.getFolderType(Packages.java.lang.Class.forName(className)) == folderType;
              }
            } catch (eCheck) {}
    
            if (!isAllowed) {
              continue;
            }
    
            try {
              var beanInfoClass = Packages.java.lang.Class.forName(className + "BeanInfo");
              var beanInfo = beanInfoClass.getConstructor().newInstance();
              var descriptor = beanInfo.getBeanDescriptor();
              var description = bean.isDocumented() ? descriptor.getShortDescription() : "Not yet documented |";
              var descParts = splitDescriptionRef(description);
              var iconPath = MySimpleBeanInfo.getIconName(beanInfo, BeanInfo.ICON_COLOR_32x32);
              var entry = {
                type: "dbo",
                id: className,
                name: descriptor.getDisplayName(),
                className: className,
                description: description,
                shortDescription: descParts.short,
                longDescription: descParts.long,
                icon: iconPath,
                builtin: true,
                additional: false,
                group: groupName,
                category: catLabel
              };
    
              if (filterInfo.hasFilter) {
                var ft = filterInfo.text;
                var matches = false;
                function contains(value) {
                  return value && String(value).toLowerCase().indexOf(ft) != -1;
                }
                if (contains(entry.name) || contains(entry.className) || contains(entry.shortDescription) ||
                    contains(entry.longDescription) || contains(entry.description) || contains(entry.group) ||
                    contains(entry.category)) {
                  matches = true;
                }
                if (!matches) {
                  continue;
                }
              }
    
              totalMatches++;
              if (limitValue > 0 && totalMatches <= startIndex) {
                continue;
              }
    
              if (limitValue > 0 && windowCount >= limitValue) {
                hasMore = true;
                stopCollect = true;
                break;
              }
    
              var categoryObj = ensureCategoryRef(catLabel, "Category");
              categoryObj.items.push(entry);
              windowCount++;
            } catch (eInfo) {}
          }
          if (stopCollect) {
            break;
          }
        }
        if (stopCollect) {
          break;
        }
      }
    }
    
    paletteItemCount = windowCount;
    paletteTotalMatches = totalMatches;
    paletteHasMore = hasMore;
    paletteNextCursor = limitValue > 0 && hasMore ? String(startIndex + windowCount) : "";'
