  expression: |
    include("js/databaseobject.js");
    include("js/marketplace.js");
↓Init [steps.SimpleStep-1764302001001]: 
  comment: Resolve target project, import library and ensure project reference
  expression: |
    'var targetProjectName = C8O.marketplace._trim(project);
    if (!targetProjectName.length && context && context.project) {
      targetProjectName = String(context.project.getName());
    }
    if (!targetProjectName.length) {
      throw new Error("project is required");
    }
    
    marketplaceImportResult = C8O.marketplace.importLibrary({
      project: targetProjectName,
      library: library,
      lib: lib,
      technicalName: technicalName,
      cloneUrl: cloneUrl,
      branch: branch,
      query: q,
      topic: topic,
      topics: topics,
      endpoint: endpoint,
      autoPull: autoPull,
      importIfMissing: importIfMissing,
      addReference: addReference,
      forceImport: forceImport,
      save: save,
      referenceName: referenceName,
      defaultLibraryTopic: defaultLibraryTopic
    });
    
    marketplaceImportRefresh = C8O.marketplace._toBoolean(refresh, true);
    marketplaceImportTargetQName = marketplaceImportResult && marketplaceImportResult.targetProject ? String(marketplaceImportResult.targetProject) : "";
    marketplaceImportLibraryQName = marketplaceImportResult && marketplaceImportResult.library ? String(marketplaceImportResult.library) : "";
    marketplaceImportLoadedAfter = marketplaceImportResult && marketplaceImportResult.loadedAfter === true;
    marketplaceImportTimestamp = java.lang.System.currentTimeMillis();'
