↓project [variables.RequestableVariable-1764302001039]: 
  comment: Target project technical name. Defaults to current context project.
↓library [variables.RequestableVariable-1764302001040]: 
  comment: Marketplace library name to import/reference (for example libApexCharts).
↓lib [variables.RequestableVariable-1764302001041]: 
  comment: Alias of library for compatibility.
↓technicalName [variables.RequestableVariable-1764302001042]: 
  comment: Optional marketplace technical repository name (name_tech).
↓cloneUrl [variables.RequestableVariable-1764302001043]: 
  comment: Optional repository clone URL override.
↓branch [variables.RequestableVariable-1764302001044]: 
  comment: Optional branch override used for import/reference URL.
↓q [variables.RequestableVariable-1764302001045]: 
  comment: Optional marketplace search text when resolving the library.
↓topic [variables.RequestableVariable-1764302001046]: 
  comment: Optional single marketplace topic filter while resolving library.
↓topics [variables.RequestableVariable-1764302001047]: 
  comment: Optional topics list as JSON array string or comma-separated values.
↓endpoint [variables.RequestableVariable-1764302001048]: 
  comment: Optional marketplace endpoint override (defaults to https://marketplace.convertigo.com/.json).
↓autoPull [variables.RequestableVariable-1764302001049]: 
  comment: Optional boolean to append :autoPull=true in project reference URL (default true).
  value: true
↓importIfMissing [variables.RequestableVariable-1764302001050]: 
  comment: Optional boolean. True imports the library when absent from workspace (default true).
  value: true
↓addReference [variables.RequestableVariable-1764302001051]: 
  comment: Optional boolean. True ensures target project has a ProjectSchemaReference (default true).
  value: true
↓forceImport [variables.RequestableVariable-1764302001052]: 
  comment: Optional boolean forwarded to referencedProjectManager.importProject(parser, force).
  value: false
↓referenceName [variables.RequestableVariable-1764302001053]: 
  comment: Optional technical name for the created/updated project reference object.
↓save [variables.RequestableVariable-1764302001054]: 
  comment: Optional boolean. True exports target project to disk after update (default true).
  value: true
↓refresh [variables.RequestableVariable-1764302001055]: 
  comment: Optional boolean. True refreshes Studio tree for target and imported projects (default true).
  value: true
↓defaultLibraryTopic [variables.RequestableVariable-1764302001056]: 
  comment: Optional boolean. True keeps default "library" topic while resolving entries.
  value: true