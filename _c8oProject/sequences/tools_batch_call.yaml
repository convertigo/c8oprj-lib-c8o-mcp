  comment: Parse input and execute generic internal tool calls with detailed reporting.
  expression: |
    'var onErrorInput = (typeof onError !== "undefined") ? onError : "stop";
    var resumeFromInput = (typeof resumeFrom !== "undefined") ? resumeFrom : null;
    var executionIdInput = (typeof executionId !== "undefined") ? executionId : null;
    
    var callsInput = (typeof calls !== "undefined") ? calls : null;
    
    batchResult = C8O.mcp.batchCall({
      calls: callsInput,
      onError: onErrorInput,
      resumeFrom: resumeFromInput,
      executionId: executionIdInput
    });
    
    refreshRequested = false;
    refreshQName = "";
    batchStudioRefresh = null;
    
    batchStop = batchResult && batchResult.stop ? batchResult.stop : {};
    batchResume = batchResult && batchResult.resume ? batchResult.resume : {};
    failedOpIdsJson = batchResume && batchResume.failedOpIds ? JSON.stringify(batchResume.failedOpIds) : "[]";
    reportJson = batchResult ? JSON.stringify(batchResult) : "{}";'
