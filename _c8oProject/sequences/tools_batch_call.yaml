      executionId: "",
      fromOpIndex: 0,
      totalOperations: 0,
      remaining: 0,
      canResume: false,
      failedOpIds: []
    };
    batchMutationFinalize = batchResult && batchResult.mutationFinalize ? batchResult.mutationFinalize : {
      optimized: false,
      optimizedCalls: 0,
      touchedQNames: [],
      refreshQName: "",
      studioRefresh: null,
      mobileBuilder: [],
      saveResults: [],
      errors: []
    };'
