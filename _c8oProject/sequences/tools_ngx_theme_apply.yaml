accessibility: Private
comment: |
  Set the visual identity of an NGX app
  Writes the app-level UIStyle AppTheme from a few tokens (preset, brand color, radius, density, toolbar, light or dark): the Ionic color variables with their contrast, shade and tint, background, text and step colors, and the --app-* spacing, type and surface tokens the ngx-page-create classes read; sets the mode on the starter GetThemeAction. LightTheme, AutoDarkTheme and TailwindTheme stay underneath.
↓Include [steps.SimpleStep-1793450000101]: 
  expression: include("js/tools_generators_ngx_theme.js");
↓Run [steps.SimpleStep-1793450000102]: 
  expression: 'var generatorResult = C8O.generators.ngxThemeApply({project: project, preset: preset, primary: primary, secondary: secondary, tertiary: tertiary, background: background, surface: surface, text: text, radius: radius, density: density, toolbar: toolbar, mode: mode, font: font, appName: appName});'
↓result [steps.JsonToXmlStep-1793450000103]: 
  jsonObject: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: JS
        - →→: generatorResult
  key: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: PLAIN
        - →→: result
