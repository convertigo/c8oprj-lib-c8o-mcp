accessibility: Private
comment: |
  List what a workflow can orchestrate
  From lib_WorkflowEngine.workflowCatalog, what the Execution card of the Workflow Studio offers: the sequences of the loaded projects with their variables (service steps and calls; serviceReady when Private without authenticated context, as service steps need), the pages with their routes and the shared components with their inputs of the NGX applications (ui.page, ui.component), and the published No Code Studio forms when C8Oforms is loaded (ui.form, startForm.form). The agent stack and the workflow libraries are left out unless named; 150 entries at most by default (truncated, limit). Designers only. Acts as the user of the MCP token, with the roles the workflow engine gives that user. Needs lib_WorkflowEngine.
