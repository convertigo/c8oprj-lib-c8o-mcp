accessibility: Private
comment: Lists marketplace libraries and highlights workspace/reference status for a target project.
↓IncludeHelpers [steps.SimpleStep-1764301001000]: 
  comment: Load shared marketplace helpers
  expression: |
    include("js/databaseobject.js");
    include("js/marketplace.js");
↓Init [steps.SimpleStep-1764301001001]: 
  comment: Query marketplace and compute project-aware suggestions
  expression: |
    'var targetProjectName = C8O.marketplace._trim(project);
    var targetProject = null;
    if (targetProjectName.length) {
      targetProject = C8O.marketplace.resolveProject(targetProjectName);
      if (targetProject == null) {
        throw new Error("Target project not found: " + targetProjectName);
      }
      targetProjectName = String(targetProject.getName());
    }
    
    var listResult = C8O.marketplace.list({
      endpoint: endpoint,
      query: q,
      topic: topic,
      topics: topics,
      sort: sort,
      limit: limit,
      cursor: _nextCursor,
      includeRaw: includeRaw,
      maxPages: maxPages,
      defaultLibraryTopic: defaultLibraryTopic
    });
    
    var entries = C8O.marketplace.annotateEntries(listResult.entries, { targetProject: targetProject });
    var suggestionCount = C8O.marketplace._toInt(suggestionLimit, 6, 1, 30);
    var suggestions = targetProject != null ?
      C8O.marketplace.buildSuggestions(entries, { limit: suggestionCount, projectName: targetProjectName }) :
      [];
    
    marketplaceListProject = targetProjectName;
    marketplaceListQuery = listResult.query;
    marketplaceListTopics = listResult.topics || [];
    marketplaceListSort = listResult.sort;
    marketplaceListTotal = listResult.totalCount;
    marketplaceListReturned = entries.length;
    marketplaceListLimit = listResult.limit;
    marketplaceListStartIndex = listResult.startIndex;
    marketplaceListHasMore = listResult.hasMore;
    marketplaceListNextCursor = listResult.nextCursor;
    marketplaceListEndpoint = listResult.endpoint;
    marketplaceListPages = listResult.pagesFetched || [];
    marketplaceListEntries = entries;
    marketplaceListSuggestions = suggestions;
    marketplaceListTimestamp = java.lang.System.currentTimeMillis();'
