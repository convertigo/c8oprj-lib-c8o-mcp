↓project [variables.RequestableVariable-1764301001055]: 
  comment: Optional target project technical name to compute recommendation status.
↓q [variables.RequestableVariable-1764301001056]: 
  comment: Optional marketplace search text.
↓topic [variables.RequestableVariable-1764301001057]: 
  comment: 'Optional single marketplace topic (example: library, front-end).'
↓topics [variables.RequestableVariable-1764301001058]: 
  comment: Optional topics list as JSON array string or comma-separated values.
↓sort [variables.RequestableVariable-1764301001059]: 
  comment: Optional marketplace sort value forwarded to marketplace filters.
↓limit [variables.RequestableVariable-1764301001060]: 
  comment: Maximum number of items returned per call (1-200, default 20).
  value: 20
↓suggestionLimit [variables.RequestableVariable-1764301001061]: 
  comment: Maximum number of suggestions returned when project is provided (1-30, default 6).
  value: 6
↓endpoint [variables.RequestableVariable-1764301001062]: 
  comment: Optional marketplace endpoint override (defaults to https://marketplace.convertigo.com/.json).
↓includeRaw [variables.RequestableVariable-1764301001063]: 
  comment: Optional boolean to include raw marketplace entries (default false).
  value: false
↓defaultLibraryTopic [variables.RequestableVariable-1764301001064]: 
  comment: Optional boolean. True keeps the default "library" topic filter when no topic is provided.
  value: true
↓maxPages [variables.RequestableVariable-1764301001065]: 
  comment: Maximum marketplace pages fetched server-side for one call (default 20).
  value: 20
↓_nextCursor [variables.RequestableVariable-1764301001066]: 
  comment: Opaque cursor forwarded from MCP _meta.nextCursor (internal).