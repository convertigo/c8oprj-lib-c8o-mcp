↓linked [variables.RequestableVariable-1817000000006]: 
  comment: true (default) also reads the tables the asked ones link, so that links, lookups and rollups stay whole; false reads the tables asked only, and a link to another table is left out and listed in omitted.
  description: true (default) also reads the tables the asked ones link, so that links, lookups and rollups stay whole; false reads the tables asked only, and a link to another table is left out and listed in omitted.
↓rows [variables.RequestableVariable-1817000000007]: 
