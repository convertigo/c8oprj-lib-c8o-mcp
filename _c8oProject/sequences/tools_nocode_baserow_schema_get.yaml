accessibility: Private
comment: |
  Read the schema of No Code Baserow tables
  Reads the structure of tables of the authenticated No Code user's catalog with the user's own Baserow account (lib_BaseRow.formscommon_SchemaApply mode describe): one c8oforms.baserow-template schema per base (fields with type, select values, links and their related field, lookups, rollups, counts, formulas, Baserow options), the tables the asked ones link (linked, default true) and, on demand, every row keyed by _key, the row id (rows). Takes tables (ids, names or paths Workspace~>Base~>Table) and/or a base (all its tables, or the tables named in it). Lists beside each schema the ids of its tables and select options, and what was left out (skipped, omitted, files). Limits: 100 tables, 2,000 rows per table, 1.8 MB; above, refused with the table and the limit. A long read answers running with its describeId. Never writes. Read existing tables with it before changing them with nocode-baserow-schema-apply, and keep their names.
responseTimeout: 300
↓Run [steps.SimpleStep-1817000000001]: 
  expression: |
    'include("js/nocode_baserow.js");
    include("js/nocode_form_write_job.js");
    var writeJob = C8O.nocodeFormWriteJob;
    var askedDescribeId = writeJob.jobIdOf(typeof describeId !== "undefined" ? describeId : null);
    var getToken = C8O.nocodeBaserow.callerToken({ token: typeof token === "undefined" ? null : token });
    var getOwner = writeJob.owner(getToken);
    var getRequest = askedDescribeId.length ? null : C8O.nocodeBaserow.schemaGetInput({
      tables: typeof tables === "undefined" ? null : tables,
      base: typeof base === "undefined" ? null : base,
      linked: typeof linked === "undefined" ? null : linked,
      rows: typeof rows === "undefined" ? null : rows
    });
    if (!getOwner.length) {
      // no bearer: auth_required, nothing is read
      result = C8O.nocodeBaserow.schemaGet({ token: getToken });
    } else if (getRequest && getRequest.status) {
      // arguments that name nothing to read are answered at once, nothing runs in a thread
      result = getRequest;
    } else {
      // the read runs in a thread of its own: past the time an agent waits, it answers running with its describeId, and the
      // same call (or the describeId alone) waits for that same read
      var getHost = writeJob.javaHost(context);
      C8O.detachedRequest = getHost.detachedRequest;
      result = writeJob.run({ kind: "describe", input: getRequest, jobId: askedDescribeId, owner: getOwner, options: { token: getToken } }, getHost);
    }'
