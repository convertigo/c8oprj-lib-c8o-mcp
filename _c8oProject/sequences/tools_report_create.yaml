accessibility: Private
comment: |
  Create a field feedback report
  Writes one structured field-feedback report under feedback/inbox/YYYY/MM/. Available only when ${mcp.report.mode=off} resolves to suggest or benchmark.
↓IncludeHelpers [steps.SimpleStep-1773134763160]: 
  comment: Load reporting helper
  expression: include("js/reporting.js");
↓Init [steps.SimpleStep-1773134763162]: 
  comment: Validate the report payload and persist one feedback entry
  expression: |
    'reportResult = C8O.reporting.writeReport({
      area: area,
      subjectId: subjectId,
      severity: severity,
      summary: summary,
      evidence: evidence,
      suggestion: suggestion,
      rolePrompt: rolePrompt,
      project: project,
      runMode: runMode,
      runId: runId,
      provider: provider,
      model: model
    });
    // An invalid call answers its error whole: every missing or invalid field at once, nothing written.
    result = reportResult.error ? reportResult : { status: reportResult.status, message: reportResult.message, reportId: reportResult.reportId, mode: reportResult.mode, path: reportResult.path, relativePath: reportResult.relativePath, createdAt: reportResult.createdAt };'
↓result [steps.JsonToXmlStep-1773134763164]: 
  jsonObject: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: JS
        - →→: result
  key: 
    - xmlizable: 
      - ↑classname: com.twinsoft.convertigo.beans.steps.SmartType
      - SmartType: 
        - ↑mode: PLAIN
        - →→: result
