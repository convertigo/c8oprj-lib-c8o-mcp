↓Init [steps.SimpleStep-1762445709653]: 
  comment: Resolve project and perform reload
  expression: |
    'var providedName = C8O.util.toTrimmedString(project);
    /* fromIonic is the import of the html edit profile (js/edit_profile.js, js/ionic_roundtrip.js); without that profile it is ignored */
    var fromIonicFlag = !!C8O.editProfile && C8O.editProfile.current() === "html" && typeof fromIonic !== "undefined" && C8O.util.toBoolean(fromIonic, false) === true;
    var ionicTargetPath = typeof ionicTarget !== "undefined" ? C8O.util.toTrimmedString(ionicTarget) : "";
    /* a stale client: the html profile asked on an engine that does not offer it (js/edit_profile.js htmlAvailable) */
    var fromIonicUnsupported = !fromIonicFlag && !!C8O.editProfile && C8O.editProfile.requested() === "html" && typeof fromIonic !== "undefined" && C8O.util.toBoolean(fromIonic, false) === true;
    var currentProjectName = "";
    if (context && context.project) {
      currentProjectName = String(context.project.getName());
    }
    if (providedName.length && providedName !== currentProjectName) {
      providedName = C8O.dbo.requireTargetProject(providedName, "reload");
    }
    
    var errorEntries = [];
    var reloadResult;
    /* the yaml edit profile (js/edit_profile.js): the agent wrote the files, their line grammar is checked first (js/yaml_line_check.js) */
    var yamlLineErrors = [];
    if (!fromIonicFlag && providedName.length && providedName !== currentProjectName && !!C8O.editProfile && C8O.editProfile.current() === "yaml" && C8O.yamlLineCheck) {
      try {
        yamlLineErrors = C8O.yamlLineCheck.checkProject(String(Packages.com.twinsoft.convertigo.engine.Engine.projectDir(providedName)));
      } catch (_ignoreYamlLineCheck) {
        yamlLineErrors = [];
      }
    }
    if (providedName.length) {
      if (currentProjectName.length && providedName === currentProjectName) {
        var forbiddenMessage = "Reloading the active MCP server project is forbidden because it unloads the running endpoint. Use project-save if you need to persist changes.";
        errorEntries.push({ name: "__forbidden__", message: forbiddenMessage });
        reloadResult = { reloaded: false, message: forbiddenMessage, status: "forbidden" };
      } else if (fromIonicFlag) {
        reloadResult = C8O.ionicRoundTrip.importIntoLoadedProject(providedName, ionicTargetPath, errorEntries);
      } else if (fromIonicUnsupported) {
        errorEntries.push({ name: "__ionic__", message: C8O.ionicRoundTrip.UNSUPPORTED_MESSAGE });
        reloadResult = { reloaded: false, status: "unsupported", message: C8O.ionicRoundTrip.UNSUPPORTED_MESSAGE };
      } else if (yamlLineErrors.length) {
        /* the yaml edit profile: files the engine cannot read are named before the reload, the project stays loaded */
        for (var yamlErrorIndex = 0; yamlErrorIndex < yamlLineErrors.length; yamlErrorIndex++) {
          var yamlError = yamlLineErrors[yamlErrorIndex];
          errorEntries.push({ name: yamlError.file + ":" + yamlError.line, message: yamlError.message + " | " + yamlError.text });
        }
        reloadResult = { reloaded: false, status: "invalid_yaml", message: yamlLineErrors.length + " line(s) the engine cannot read: fix them (errors names each file:line), then call project-reload again. Nothing was reloaded: the project stays as it was." };
      } else {
        reloadResult = C8O.dbo.reloadProject(providedName, errorEntries);
      }
    } else {
      var missingMessage = "Project name is required";
      errorEntries.push({ name: "__reload__", message: missingMessage });
      reloadResult = { reloaded: false, message: missingMessage, status: "missing" };
    }
    
    var reloadedFlag = reloadResult.reloaded === true;
    var statusText = reloadResult.status || (reloadedFlag ? "reloaded" : (providedName.length ? "failed" : "missing"));
    
    projectReloadRequested = providedName;
    projectReloadCurrentProject = currentProjectName;
    projectReloadReloaded = reloadedFlag;
    projectReloadMessage = reloadResult.message || "";
    projectReloadTimestamp = java.lang.System.currentTimeMillis();
    projectReloadErrors = errorEntries;
    projectReloadStatus = statusText;
    projectReloadIonic = fromIonicFlag ? {
      fromIonic: true,
      ionicImported: reloadResult.ionicImported === true,
      ionicSource: reloadResult.ionicSource || "",
      ionicTarget: reloadResult.ionicTarget || ionicTargetPath,
      ionicReport: reloadResult.ionicReport || { processed: 0, pagesUpdated: 0, sharedComponentsUpdated: 0, templatesUpdated: 0, stylesUpdated: 0, scriptsUpdated: 0, skipped: 0, warnings: [], changedObjects: [] }
    } : null;
    '
