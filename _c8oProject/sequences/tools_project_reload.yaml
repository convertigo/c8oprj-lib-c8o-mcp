accessibility: Private
comment: |
  Reload a project from disk
  Reloads one project and discards unsaved in-memory changes. Pass `fromIonic=true` to reimport supported `_private/ionic` frontend edits before reload. Add `ionicTarget` to import only one generated Ionic file/directory into the loaded tree without a full project reload. `preserveIonic` is legacy/internal; agent workflows should move/restore edited authoring files explicitly around backend reloads instead.
↓IncludeHelpers [steps.SimpleStep-1762445690829]: 
  comment: Load shared database helpers
  expression: include("js/databaseobject.js");
↓Init [steps.SimpleStep-1762445709653]: 
  comment: Resolve project and perform reload
  expression: |
    'var providedName = C8O.util.toTrimmedString(project);
    var preserveIonicFlag = C8O.util.toBoolean(preserveIonic, false) === true;
    var fromIonicFlag = C8O.util.toBoolean(fromIonic, false) === true;
    var ionicTargetPath = C8O.util.toTrimmedString(ionicTarget);
    if (!providedName.length && context && context.project) {
      providedName = currentProjectName;
    }
    
    var errorEntries = [];
    var reloadResult;
    if (providedName.length) {
      reloadResult = C8O.dbo.reloadProject(providedName, errorEntries, { preserveIonic: preserveIonicFlag, fromIonic: fromIonicFlag, ionicTarget: ionicTargetPath });
    } else {
      var missingMessage = "Project name is required";
      errorEntries.push({ name: "__reload__", message: missingMessage });
      reloadResult = { reloaded: false, message: missingMessage, preserveIonic: preserveIonicFlag, fromIonic: fromIonicFlag, ionicImported: false, ionicSource: "", ionicTarget: ionicTargetPath, ionicReport: null };
    }
    
    var reloadedFlag = reloadResult.reloaded === true;
    var statusText = reloadedFlag
      ? (fromIonicFlag
        ? (ionicTargetPath.length ? "imported_from_ionic" : "reloaded_from_ionic")
        : (preserveIonicFlag ? "reloaded_preserving_ionic" : "reloaded"))
      : (providedName.length ? "failed" : "missing");
    
    projectReloadRequested = providedName;
    projectReloadPreserveIonic = preserveIonicFlag;
    projectReloadFromIonic = fromIonicFlag;
    projectReloadReloaded = reloadedFlag;
    projectReloadIonicImported = reloadResult.ionicImported === true;
    projectReloadIonicSource = reloadResult.ionicSource || "";
    projectReloadIonicTarget = reloadResult.ionicTarget || ionicTargetPath;
    projectReloadIonicReport = reloadResult.ionicReport || {};
    projectReloadMessage = reloadResult.message || "";
    projectReloadTimestamp = java.lang.System.currentTimeMillis();
    projectReloadErrors = errorEntries;
    projectReloadStatus = statusText;
    '
