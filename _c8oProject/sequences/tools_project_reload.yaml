accessibility: Private
comment: |
  Reload a project from disk
  Reloads one project and discards unsaved in-memory changes. Use only when you explicitly want disk state to win.
↓IncludeHelpers [steps.SimpleStep-1762445690829]: 
  comment: Load shared database helpers
  expression: include("js/databaseobject.js");
↓Init [steps.SimpleStep-1762445709653]: 
  comment: Resolve project and perform reload
  expression: |
    'var providedName = C8O.util.toTrimmedString(project);
    if (!providedName.length && context && context.project) {
      providedName = String(context.project.getName());
    }
    
    var errorEntries = [];
    var reloadResult;
    if (providedName.length) {
      reloadResult = C8O.dbo.reloadProject(providedName, errorEntries);
    } else {
      var missingMessage = "Project name is required";
      errorEntries.push({ name: "__reload__", message: missingMessage });
      reloadResult = { reloaded: false, message: missingMessage };
    }
    
    var reloadedFlag = reloadResult.reloaded === true;
    var statusText = reloadedFlag ? "reloaded" : (providedName.length ? "failed" : "missing");
    
    projectReloadRequested = providedName;
    projectReloadReloaded = reloadedFlag;
    projectReloadMessage = reloadResult.message || "";
    projectReloadTimestamp = java.lang.System.currentTimeMillis();
    projectReloadErrors = errorEntries;
    projectReloadStatus = statusText;
    '
