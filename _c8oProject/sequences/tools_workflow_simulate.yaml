accessibility: Private
comment: |
  Simulate a workflow state or a path of actions
  Dry runs on the draft (default), a published version, a definition not saved or a request: without event, what a state shows with given data (actions with their fields, sections, notices, errors under the fields, progress, how it is done: ui, service); with event, where that action leads (the state reached after the automatic routing, the data, or why it is refused); with path, several actions chained, each from where the previous one led. Nothing is saved, notified or called (service steps are skipped). The draft and a definition need a designer; a request is simulated with the rights of the token user. Acts as the user of the MCP token, with the roles the workflow engine gives that user. Needs lib_WorkflowEngine.
↓Run [steps.SimpleStep-1794200000030]: 
  expression: |
    'include("js/mcp_auth.js");
    include("js/workflow_tools.js");
    result = C8O.workflowTools.simulate({
      workflowKey: typeof workflowKey === "undefined" ? null : workflowKey,
      source: typeof source === "undefined" ? null : source,
      version: typeof version === "undefined" ? null : version,
      definition: typeof definition === "undefined" ? null : definition,
      instanceId: typeof instanceId === "undefined" ? null : instanceId,
      state: typeof state === "undefined" ? null : state,
      data: typeof data === "undefined" ? null : data,
      businessKey: typeof businessKey === "undefined" ? null : businessKey,
      event: typeof event === "undefined" ? null : event,
      payload: typeof payload === "undefined" ? null : payload,
      path: typeof path === "undefined" ? null : path,
      full: typeof full === "undefined" ? null : full
    });'
