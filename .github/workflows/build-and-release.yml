# Pushes and tags build archives only. Every newly tagged release starts as a
# pre-release; stable promotion is an explicit reviewed operation.
# Deployment is never part of this workflow, even without [skip deploy].

name: Convertigo CI

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SSH_KEY }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
            path: |
               ~/.gradle/caches
               ~/.gradle/wrapper
            key: ${{ runner.os }}-gradle-caches-v1-${{ hashFiles('**/*.gradle', '**/gradle/wrapper/gradle-wrapper.properties') }}
            restore-keys: ${{ runner.os }}-gradle-caches-v1-

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
            path: |
              ${{ github.workspace }}/_private/ionic/node_modules
              ${{ github.workspace }}/_private/ionic/.angular
              /home/runner/convertigo/nodes
            key: ${{ runner.os }}-build-node-${{ hashFiles('**/package.json', '**/_private/ionic/version.json') }}
            restore-keys: ${{ runner.os }}-build-node-

      - name: Convertigo generate application code
        env:
          C8O_SERVER: ${{ github.ref_type == 'tag' && secrets.C8O_SERVER_PROD || secrets.C8O_SERVER }}
        run: |
          PROJECT_VERSION_ARG=()
          if [ "${{ github.ref_type }}" = "tag" ]; then
            PROJECT_VERSION_ARG+=("-Pconvertigo.load.projectVersion=${GITHUB_REF_NAME#v}")
          fi
          echo "Generate Mobile Builder App" && \
          sh gradlew --stacktrace --info generateMobileBuilder export -x compileMobileBuilder \
            "${PROJECT_VERSION_ARG[@]}" \
            -Pconvertigo.load.mobileApplicationEndpoint=$C8O_SERVER

      - name: Build CAR without deployment
        run: |
          PROJECT_VERSION_ARG=()
          if [ "${{ github.ref_type }}" = "tag" ]; then
            PROJECT_VERSION_ARG+=("-Pconvertigo.load.projectVersion=${GITHUB_REF_NAME#v}")
          fi
          echo "Building CAR without deployment"
          sh gradlew --stacktrace --info car -x generateMobileBuilder \
            "${PROJECT_VERSION_ARG[@]}"

      # An engine deploys the first project descriptor it finds in the archive: 0.3.0-beta.12 shipped a test fixture
      # first and deployed it in place of lib_ConvertigoMCP. The archive must hold this project's descriptor only.
      - name: Check the CAR holds this project only
        run: |
          car=$(ls build/*.car | head -n 1)
          descriptors=$(unzip -Z1 "$car" | grep -E '(^|/)c8oProject\.(yaml|xml)$' || true)
          echo "Project descriptors in $car:"
          echo "$descriptors"
          if [ "$descriptors" != "lib_ConvertigoMCP/c8oProject.yaml" ]; then
            echo "::error::The archive must hold one project descriptor, lib_ConvertigoMCP/c8oProject.yaml"
            exit 1
          fi

      # The CRUD kit templates this project held (since removed) named __PROJECT_NAME__: a Studio save turned that placeholder
      # into a reference, shipped from March to 0.3.0-beta.22 and shown as a broken project in every Studio.
      - name: Check the references name real projects
        run: |
          car=$(ls build/*.car | head -n 1)
          placeholders=$(unzip -p "$car" lib_ConvertigoMCP/c8oProject.yaml | grep -E '^ +projectName: *__[A-Za-z0-9_]+__' || true)
          if [ -n "$placeholders" ]; then
            echo "::error::A reference names a placeholder, not a project: $placeholders"
            exit 1
          fi

      - name: Save application project
        uses: actions/upload-artifact@v4
        with:
          name: project
          path: build/*.car

  release:
    if: github.ref_type == 'tag'
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download CAR File
        uses: actions/download-artifact@v4
        with:
          name: project

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.car'
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
