services:
  mariadb:
    image: mariadb:11
    container_name: ${COMPOSE_PROJECT_NAME}_mariadb
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    ports:
      - "${MARIADB_PORT}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -P 3306 -uroot -p${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
